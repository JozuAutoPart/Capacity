<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>Print STEM Tags (6 Tags / A4 Landscape)</title>
    <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>
    <style>
        @page {
            size: A4 landscape;
            margin: 0;
        }
        body {
            font-family: 'Tahoma', sans-serif;
            background: #eee;
            margin: 0;
            padding: 10px;
        }
        .page {
            width: 297mm;
            height: 210mm;
            padding: 6mm 8mm;
            margin: 0 auto;
            background: white;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            box-sizing: border-box;
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            grid-template-rows: repeat(3, 1fr);
            gap: 4mm;
            page-break-after: always;
            page-break-inside: avoid;
        }
        @media print {
            body { 
                background: none; 
                padding: 0; 
                margin: 0;
            }
            .page { 
                box-shadow: none; 
                margin: 0; 
                width: 297mm;
                height: 210mm;
                page-break-after: always;
                page-break-inside: avoid;
            }
            .no-print { display: none; }
        }
        .tag-card {
            border: 2px solid #000;
            padding: 6px 8px;
            box-sizing: border-box;
            font-size: 10px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            background: #fff;
            height: 100%;
        }
        table.tag-table {
            width: 100%;
            border-collapse: collapse;
            border: 1px solid #000;
            table-layout: fixed;
        }
        table.tag-table th, table.tag-table td {
            border: 1px solid #000;
            padding: 4px 6px;
            vertical-align: middle;
            overflow: hidden;
        }
        .label-title { font-weight: bold; }
        .text-center { text-align: center; }
        .fw-bold { font-weight: bold; }
        .footer-section {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 4px;
        }
        .logo-box {
            font-weight: bold;
            font-style: italic;
            font-size: 14px;
            color: #003366;
            font-family: 'Arial Black', sans-serif;
        }
        .barcode-box {
            text-align: center;
            flex-grow: 1;
            margin-left: 15px;
            margin-right: 15px;
        }
        .barcode-box svg {
            max-height: 32px;
            width: 100%;
        }
    </style>
</head>
<body>

    <div class="no-print" style="text-align: center; margin-bottom: 20px;">
        <button onclick="window.print()" style="padding: 10px 20px; font-size: 16px; background: #28a745; color: white; border: none; cursor: pointer; border-radius: 5px;">
            🖨️ พิมพ์ใบ Tag ทั้งหมด (แนวนอน)
        </button>
        <span id="tagInfoSummary" style="margin-left: 15px; font-weight: bold; color: #333;"></span>
    </div>

    <div id="container"></div>

    <script>
        // 📌 ฐานข้อมูลสำรอง (กรณีไม่ได้ส่งค่าผ่าน URL)
        const partDatabase = {
            "17442-BZ430": {
                partName: "BRACKET SUB-ASSY, RADIATOR",
                code: "JA193",
                qty: 50
            },
            "17443-BZ190": {
                partName: "BRACKET SUB-ASSY, EXHAUST PIPE",
                code: "JA193",
                qty: 50
            }
        };

        const urlParams = new URLSearchParams(window.location.search);
        const partNo = urlParams.get('partNo') || '17442-BZ430';
        const lotNo = urlParams.get('lotNo') || '-';
        
        const dbInfo = partDatabase[partNo] || {
            partName: "ไม่ระบุชื่อชิ้นส่วน",
            code: "JA193",
            qty: 50
        };

        // ดึงค่า Part Name, Code และ จำนวนต่อ Tag (จากคอลัมน์ C)
        const partName = urlParams.get('partName') || dbInfo.partName;
        const tagCode = urlParams.get('code') || dbInfo.code;
        const qtyPerTag = parseInt(urlParams.get('qty')) || dbInfo.qty;

        document.getElementById('tagInfoSummary').innerText = `Part No: ${partNo} | Part Name: ${partName} | Qty/Tag: ${qtyPerTag} | Lot: ${lotNo}`;

        const totalTags = 6; 
        const container = document.getElementById('container');

        let pageDiv = document.createElement('div');
        pageDiv.className = 'page';

        for (let i = 0; i < totalTags; i++) {
            const card = document.createElement('div');
            card.className = 'tag-card';
            card.innerHTML = `
                <table class="tag-table">
                    <tr>
                        <td style="width: 22%;" class="label-title">Part No.</td>
                        <td style="width: 40%;" class="fw-bold">${partNo}</td>
                        <td style="width: 18%;" class="label-title text-center">Stamp Mark</td>
                        <td style="width: 20%;"></td>
                    </tr>
                    <tr>
                        <td class="label-title">Part Name</td>
                        <td class="fw-bold" colspan="3">${partName}</td>
                    </tr>
                    <tr>
                        <td class="label-title">Q'ty</td>
                        <td><span class="fw-bold">${qtyPerTag}</span> Pcs.</td>
                        <td class="label-title text-center">Code</td>
                        <td class="text-center fw-bold">${tagCode}</td>
                    </tr>
                    <tr>
                        <td class="label-title">Production / Lot No.:</td>
                        <td>${lotNo}</td>
                        <td class="label-title text-center">Supplier Check</td>
                        <td class="label-title text-center">Delivery Date</td>
                    </tr>
                </table>
                <table class="tag-table" style="margin-top: 2px;">
                    <tr>
                        <td class="text-center" style="font-size: 8.5px; width: 25%;">Production Date</td>
                        <td class="text-center" style="font-size: 8.5px; width: 25%;">Supplier Check</td>
                        <td class="text-center" style="font-size: 8.5px; width: 25%;">Delivery Date</td>
                        <td class="text-center" style="font-size: 8.5px; width: 25%;">QC Receiving</td>
                    </tr>
                    <tr>
                        <td style="height: 18px; width: 25%;"></td>
                        <td style="width: 25%;"></td>
                        <td style="width: 25%;"></td>
                        <td style="width: 25%;"></td>
                    </tr>
                </table>
                <div class="footer-section">
                    <div class="logo-box">STEM</div>
                    <div class="barcode-box">
                        <svg class="barcode"></svg>
                    </div>
                </div>
            `;
            pageDiv.appendChild(card);
        }
        container.appendChild(pageDiv);

        document.querySelectorAll('.barcode').forEach((el) => {
            JsBarcode(el, lotNo !== '-' ? lotNo : '123456', {
                format: "CODE128",
                displayValue: false,
                height: 30,
                margin: 0
            });
        });
    </script>
</body>
</html>
