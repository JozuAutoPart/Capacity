        .tag-container {

        .tag-footer {
            border-top: 1px solid #000;
            padding-top: 2px;
            text-align: center;
            font-size: 8pt;
            color: #000;
        }
        .text-black-custom {
            color: #000 !important;
        }
        @media print {
            body {
                background: none;
            }
            .no-print {
                display: none;
            }
            .tag-container {
                margin: 0;
                box-shadow: none;
                width: 100mm;
                height: 50mm;
                page-break-after: always;
            }
        }
        .partno-large {
    font-size: 20pt !important;

}

            "76575A020P": "SP251-590PQ/1.6x140xCoil",
            "76564A020P": "SP251-590PQ/1.8x246xCoil",
            "76482 2LS0B": "SP783-590BQ/1.6x157xCoil",
            "76483 2LS0B": "SP783-590BQ/1.6x157xCoil",
            "76482 5R71A": "SP783-590BQ/1.6x157xCoil",
            "76483 5R71A": "SP783-590BQ/1.6x157xCoil",
            "76482 2LS2B": "SP783-590BQ/1.6x157xCoil",
            "76483 2LS2B": "SP783-590BQ/1.6x157xCoil"

        };
   
        const params = new URLSearchParams(window.location.search);
        
        // จัดการวันที่ (แสดงผลเป็น ค.ศ.)
        const rawDate = params.get('date') || '';
        let formattedDate = rawDate;
        if (rawDate) {
            let parts = rawDate.split('-');
            if (parts.length === 3) {
                formattedDate = `${parts[2]}/${parts[1]}/${parts[0]}`;
            }
        } else {
            let now = new Date();
            let dd = String(now.getDate()).padStart(2, '0');
            let mm = String(now.getMonth() + 1).padStart(2, '0');
            let yyyy = now.getFullYear();
            formattedDate = `${dd}/${mm}/${yyyy}`;
        }

        const partNo = params.get('partNo') || '-';
        const icNo = params.get('icNo') || '-';
        const qty = params.get('qty') || '0';
        const unit = params.get('unit') || 'Sheet';

        // เช็คว่าถ้าใน URL มีการส่ง Type มา ให้ใช้ค่านั้นก่อน แต่ถ้าไม่มี ให้ดึงจากตาราง partTypeMapping อัตโนมัติตาม Part No.
        let type = params.get('type') || '';
        if ((!type || type === '-') && partTypeMapping[partNo]) {
            type = partTypeMapping[partNo];
        } else if (!type) {
            type = '-';
        }

        // แสดงผลลงในหน้า Tag
        document.getElementById('lblDate').innerText = formattedDate;
        document.getElementById('lblPartNo').innerText = partNo;
        document.getElementById('lblIcNo').innerText = icNo;
        document.getElementById('lblType').innerText = type;
        document.getElementById('lblQty').innerText = `${Number(qty).toLocaleString()} ${unit}`;
    </script>
</body>
</html>
