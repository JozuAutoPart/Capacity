<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tag Printing System</title>
    <!-- เรียกใช้งาน JsBarcode สำหรับสร้างบาร์โค้ด -->
    <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.0/dist/JsBarcode.all.min.js"></script>
    <style>
        /* กำหนดค่าเริ่มต้นสำหรับการพิมพ์ */
        body {
            font-family: 'Sarabun', sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f4f4f4;
        }
        
        .summary-box {
            margin-bottom: 20px;
            font-size: 16px;
            font-weight: bold;
        }

        /* ดีไซน์หน้ากระดาษ A4 สำหรับพิมพ์ */
        .page {
            width: 210mm;
            min-height: 297mm;
            padding: 10mm;
            margin: 0 auto 10mm auto;
            background: white;
            box-shadow: 0 0 5px rgba(0,0,0,0.1);
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            gap: 5mm;
        }

        /* ดีไซน์ตัวการ์ด Tag แต่ละใบ */
        .tag-card {
            width: 100%;
            height: 43mm; /* คำนวณให้พอดี 6 ใบต่อ 1 หน้า A4 */
            border: 1.5px solid #000;
            box-sizing: border-box;
            padding: 4px 8px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            background: #fff;
        }

        .tag-table {
            width: 100%;
            border-collapse: collapse;
        }

        .tag-table td {
            border: 1px solid #000;
            padding: 2px 4px;
            font-size: 11px;
            vertical-align: middle;
        }

        .label-title {
            background-color: #f0f0f0;
            font-weight: bold;
        }

        .fw-bold {
            font-weight: bold;
        }

        .text-center {
            text-align: center;
        }

        .footer-section {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 2px;
        }

        .logo-box {
            padding: 2px 8px;
            border: 1px solid black;
            text-align: center;
        }

        .barcode-box {
            text-align: right;
        }

        /* ซ่อนส่วนนี้เวลาสั่ง Print หน้าเว็บ */
        @media print {
            body {
                background: none;
                padding: 0;
            }
            .page {
                margin: 0;
                box-shadow: none;
                page-break-after: always;
            }
            .no-print {
                display: none;
            }
        }
    </style>
</head>
<body>

    <div class="no-print summary-box" id="tagInfoSummary">
        <!-- ข้อมูลสรุปจะแสดงตรงนี้ -->
    </div>

    <!-- พื้นที่สำหรับแสดง Tag ทั้งหมด -->
    <div id="container"></div>

    <script>
        // --- ข้อมูลจำลองสำหรับทดสอบ (สามารถเปลี่ยนเป็นรับค่าจากฟอร์มหรือตัวแปรหลักของคุณได้) ---
        let totalOrderQty = 1200; // ยอดสั่งผลิตทั้งหมด
        let qtyPerTag = 200;      // จำนวนต่อ 1 ใบ Tag
        let partNo = "33567-B1010";
        let partName = "CLAMP, CONTROL SHAFT TUBE NO.1";
        let lotNo = "LOT20260901";
        let tagCode = "FTS-01";   // รหัส Code สำหรับเช็คชื่อบริษัทและทำ Barcode
        // ----------------------------------------------------------------------------------

        // คำนวณจำนวนใบ Tag ที่ต้องพิมพ์ทั้งหมด (ยอดสั่งผลิต ÷ จำนวนต่อใบ)
        let totalTags = totalOrderQty > 0 ? Math.ceil(totalOrderQty / qtyPerTag) : 6;

        document.getElementById('tagInfoSummary').innerText = `Part No: ${partNo} | Qty/Tag: ${qtyPerTag} | Total Order: ${totalOrderQty} | Total Tags: ${totalTags} ใบ`;

        const container = document.getElementById('container');
        // ล้างข้อมูลเก่าใน container ก่อนเริ่มสร้างใหม่
        container.innerHTML = ''; 

        let pageDiv = document.createElement('div');
        pageDiv.className = 'page';

        for (let i = 0; i < totalTags; i++) {
            // ขึ้นหน้าใหม่ทุกๆ 6 ใบ Tag
            if (i > 0 && i % 6 === 0) {
                container.appendChild(pageDiv);
                pageDiv = document.createElement('div');
                pageDiv.className = 'page';
            }

            // กำหนดเงื่อนไขเปลี่ยนชื่อบริษัทตาม Code (STEM, FTS, TMC, MSFT, TH)
            let companyName = "STEM"; 
            if (tagCode.includes("FTS") || tagCode.startsWith("F")) {
                companyName = "FTS";
            } else if (tagCode.includes("TMC") || tagCode.startsWith("T")) {
                companyName = "TMC";
            } else if (tagCode.includes("MSFT") || tagCode.startsWith("M")) {
                companyName = "MSFT";
            } else if (tagCode.includes("TH") || tagCode.startsWith("H")) {
                companyName = "TH";
            } else {
                companyName = "STEM";
            }

            const card = document.createElement('div');
            card.className = 'tag-card';
            card.innerHTML = `
                <table class="tag-table">
                    <tr>
                        <td style="width: 22%; font-size: 14px; font-weight: bold;" class="label-title">Part No.</td>
                        <td colspan="3" class="fw-bold" style="font-size: 24px; font-weight: bold; padding: 10px 6px; letter-spacing: 0.5px;">${partNo}</td>
                    </tr>
                    <tr>
                        <td class="label-title">Part Name</td>
                        <td class="fw-bold" colspan="3">${partName}</td>
                    </tr>
                    <tr>
                        <td class="label-title">Q'ty</td>
                        <td style="font-size: 16px;"><span class="fw-bold" style="font-size: 20px;">${qtyPerTag}</span> Pcs.</td>
                        <td class="label-title text-center" style="width: 22%;">Stamp Mark</td>
                        <td class="text-center fw-bold" style="width: 25%;"></td>
                    </tr>
                    <tr>
                        <td class="label-title">Production / Lot No.:</td>
                        <td>${lotNo}</td>
                        <td class="label-title text-center">Code</td>
                        <td class="text-center fw-bold" style="font-size: 20px;">${tagCode}</td>
                    </tr>
                    <tr>
                        <td class="text-center" style="font-size: 10px;">Production Date</td>
                        <td class="text-center" style="font-size: 10px;">Supplier Check</td>
                        <td class="text-center" style="font-size: 10px;">Delivery Date</td>
                        <td class="text-center" style="font-size: 10px;">QC Receiving</td>
                    </tr>
                    <tr>
                        <td style="height: 35px;"></td>
                        <td></td>
                        <td></td>
                        <td></td>
                    </tr>
                </table>
                <div class="footer-section">
                    <div class="logo-box" style="color: black; border-color: black; font-weight: bold; font-size: 20px;">${companyName}</div>
                    <div class="barcode-box">
                        <svg class="barcode"></svg>
                    </div>
                </div>
            `;
            pageDiv.appendChild(card);
        }

        // นำ pageDiv หน้าสุดท้ายใส่ลงใน container หลังจบลูปเสมอ
        container.appendChild(pageDiv);

        // สร้าง Barcode ด้วย JsBarcode
        document.querySelectorAll('.barcode').forEach((el) => {
            JsBarcode(el, tagCode !== '-' ? tagCode : '123456', {
                format: "CODE128",
                displayValue: false,
                height: 30,
                margin: 0
            });
        });
    </script>
</body>
</html>
