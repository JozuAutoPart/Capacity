<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>Print STEM Tags (6 Tags / A4 Landscape)</title>
    <!-- โหลดไลบรารี JsBarcode -->
    <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>
    <style>
        @page {
            size: A4 landscape;
            margin: 0;
        }
        body {
            font-family: 'Tahoma', 'Arial', sans-serif;
            background: #eee;
            margin: 0;
            padding: 5px;
        }
        .no-print-bar {
            background: #333;
            color: #fff;
            padding: 8px 15px;
            margin-bottom: 10px;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .page {
            width: 297mm;
            height: 210mm;
            padding: 5mm 6mm;
            margin: 0 auto 5mm auto;
            background: white;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            box-sizing: border-box;
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            grid-template-rows: repeat(3, 1fr);
            gap: 3mm 4mm;
            page-break-after: always;
            page-break-inside: avoid;
        }
        @media print {
            body { background: none; padding: 0; }
            .no-print-bar { display: none !important; }
            .page { box-shadow: none; margin: 0; width: 297mm; height: 210mm; }
        }

        .tag-card {
            border: 1.5px solid #000;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 2px;
            background: #fff;
            font-size: 10px;
            height: 100%;
        }

        .tag-table {
            width: 100%;
            border-collapse: collapse;
            table-layout: fixed;
        }

        .tag-table td {
            border: 1px solid #000;
            padding: 2px 4px;
            vertical-align: middle;
            word-wrap: break-word;
            height: 17px;
        }

        .fw-bold { font-weight: bold; }
        .text-center { text-align: center; }

        .part-no-text {
            font-size: 20px;
            font-weight: 900;
            letter-spacing: 0.5px;
            padding: 3px 4px;
        }

        .qty-text {
            font-size: 16px;
            font-weight: bold;
        }

        .code-text {
            font-size: 16px;
            font-weight: bold;
        }

        .bottom-section {
            display: flex;
            align-items: center;
            border-top: 1px solid #000;
            padding-top: 2px;
            margin-top: 2px;
        }

        .logo-stem {
            font-size: 15px;
            font-style: italic;
            font-weight: 900;
            padding-left: 5px;
            width: 20%;
        }

        .barcode-container {
            width: 80%;
            text-align: center;
            padding-right: 5px;
        }

        .barcode-container svg {
            width: 100%;
            height: 28px;
        }
    </style>
</head>
<body>

    <div class="no-print-bar">
        <div>
            <button onclick="window.print()" style="padding: 6px 14px; background: #28a745; color: white; border: none; border-radius: 4px; font-weight: bold; cursor: pointer;">
                🖨️ พิมพ์ใบ Tag ทั้งหมด (แนวนอน)
            </button>
            <span id="tagSummary" style="margin-left: 15px; font-weight: bold; font-size: 12px;"></span>
        </div>
    </div>

    <div id="printContainer"></div>

    <script>
        const Masterparts = {
            "53219-0D020": { partName: "SUPPORT, RADIATOR, LWR RR", qty: 50, code: "JA114" },
            "55330-0D480-10": { partName: "REINFORCEMENT ASSY, INSTRUMENT PANEL", qty: 25, code: "JA118" },
            "55330-0D490-10": { partName: "REINFORCEMENT ASSY, INSTRUMENT PANEL", qty: 25, code: "JA119" },
            "61761-KK040": { partName: "REINFROCE, SEAT BELT ANCHOR, NO.1 UPR RH", qty: 45, code: "JA183" },
            "61762-KK050": { partName: "REINFROCE, SEAT BELT ANCHOR, NO.1 UPR LH", qty: 45, code: "JA184" },
            "55428-0D010": { partName: "BRACKET, AIR BAG PASSENGER MT, NO.2", qty: 50, code: "JA197" },
            "55428-0D020": { partName: "BRACKET, AIR BAG PASSENGER MT, NO.2", qty: 50, code: "JA199" },
            "58309-06190": { partName: "RETAINER SUB ASSY LUG DOOR LOCK STRIKER", qty: 90, code: "JA217" },
            "57248-0D010": { partName: "BRK, T FLEXIBLE HOSE NO.1 OR", qty: 100, code: "JA112" },
            "57249-0D040": { partName: "BRK, T FLEXIBLE HOSE NO.1 OL", qty: 100, code: "JA113" },
            "67323-0D090": { partName: "EXTENSION, FR DOOR BEAM, RR RH", qty: 80, code: "JA121" },
            "67324-0D060": { partName: "EXTENSION, FR DOOR BEAM, RR LH", qty: 80, code: "JA122" },
            "62590-4JA0A": { partName: "R/F-RAD CORE LWR", qty: 30, code: "JA160" },
            "62590-4JA5A": { partName: "R/F-RAD CORE LWR", qty: 30, code: "JA161" },
            "76294-4JA0A": { partName: "BULKHEAD ASSY-FR PLR, LWR RH", qty: 60, code: "JA166" },
            "76295-4JA0A": { partName: "BULKHEAD ASSY-FR PLR, LWR LH", qty: 60, code: "JA167" },
            "76344-4JG1A": { partName: "ANCH ASSY-SEAT BELT", qty: 60, code: "JA168" },
            "55328-KK030": { partName: "STAY, INSTRUMENT PANEL, NO.3", qty: 50, code: "JA176" },
            "55328-KK040": { partName: "STAY, INSTRUMENT PANEL, NO.3", qty: 70, code: "JA177" },
            "55329-KK030": { partName: "STAY, INSTRUMENT PANEL, NO.4", qty: 70, code: "JA178" },
            "55329-KK040": { partName: "STAY, INSTRUMENT PANEL, NO.4", qty: 50, code: "JA179" },
            "58221-KK010": { partName: "REINFOCEMENT, FLOOR PANEL, FR RH", qty: 100, code: "JA186" },
            "58222-KK010": { partName: "REINFOCEMENT, FLOOR PANEL, FR LH", qty: 100, code: "JA187" },
            "58221-KK020": { partName: "REINFOCEMENT, FLOOR PANEL, FR RH", qty: 100, code: "JA192" },
            "58222-KK020": { partName: "REINFOCEMENT, FLOOR PANEL, FR LH", qty: 100, code: "JA193" },
            "51638-0K010": { partName: "REINFORCEMENT, SHOCK ABSORBER BRKT, LH", qty: 100, code: "JA189" },
            "67323-0D150": { partName: "EXTENSION, FR DOOR BEAM, RR RH", qty: 80, code: "JA194" },
            "67324-0D120": { partName: "EXTENSION, FR DOOR BEAM, RR LH", qty: 80, code: "JA195" },
            "55308-0D070": { partName: "BRACE SUB-ASSY, INSTRUMENT PANEL, NO.3", qty: 30, code: "JA202" },
            "55308-0D080": { partName: "BRACE SUB-ASSY, INSTRUMENT PANEL, NO.3", qty: 30, code: "JA203" },
            "55125-0D130": { partName: "BRACKET, STEERING SUPPORT", qty: 80, code: "JA206" },
            "55323-06210": { partName: "BRACKET, FLOOR BRACE MOUNTING, NO.3", qty: 150, code: "JA212" },
            "67327-06190": { partName: "EXTENSION, RR DOOR BEAM, RR RH", qty: 50, code: "JA222" },
            "67328-06190": { partName: "EXTENSION, RR DOOR BEAM, RR LH", qty: 50, code: "JA223" },
            "55365-06030": { partName: "BRACKET, RADIO TUNER MOUNTION, NO.1", qty: 80, code: "JA254" },
            "55366-KK020": { partName: "BRACKET, RADIO TUNER MOUNTING, NO.2", qty: 50, code: "JA318" },
            "55381-BZ160": { partName: "BRACKET, FINISH PANEL MOUNTING, NO.1", qty: 50, code: "JA269" }
        };

        function getUrlParams() {
            const params = new URLSearchParams(window.location.search);
            const pNo = params.get('partNo') || '55366-KK020';
            
            const cleanP = pNo.trim().toLowerCase();
            const foundKey = Object.keys(Masterparts).find(k => k.trim().toLowerCase() === cleanP);
            const master = Masterparts[foundKey] || {};

            return {
                partNo: pNo,
                partName: params.get('partName') || master.partName || 'BRACKET, RADIO TUNER MOUNTING, NO.2',
                qty: master.qty || 50,
                totalOrder: parseInt(params.get('qty')) || parseInt(params.get('totalOrder')) || 6300,
                lotNo: params.get('lotNo') || '1037601',
                code: params.get('code') || master.code || 'JA318'
            };
        }

        function generateTags() {
            const data = getUrlParams();
            const stdPack = data.qty;
            const totalOrder = data.totalOrder;
            const totalTags = Math.ceil(totalOrder / stdPack);

            const container = document.getElementById('printContainer');
            document.getElementById('tagSummary').innerText = `Part No: ${data.partNo} | Qty/Tag: ${stdPack} | Total Order: ${totalOrder.toLocaleString()} | Total Tags: ${totalTags} ใบ`;

            container.innerHTML = '';
            let currentContainer = null;

            for (let i = 1; i <= totalTags; i++) {
                if ((i - 1) % 6 === 0) {
                    currentContainer = document.createElement('div');
                    currentContainer.className = 'page';
                    container.appendChild(currentContainer);
                }

                const currentQty = (i === totalTags && totalOrder % stdPack !== 0) ? (totalOrder % stdPack) : stdPack;

                const tagCard = document.createElement('div');
                tagCard.className = 'tag-card';
                tagCard.innerHTML = `
                    <table class="tag-table">
                        <tr>
                            <td style="width: 22%; font-size: 11px;">Part No.</td>
                            <td colspan="3" class="part-no-text">${data.partNo}</td>
                        </tr>
                        <tr>
                            <td style="font-size: 11px;">Part Name</td>
                            <td colspan="3" class="fw-bold" style="font-size: 11px;">${data.partName}</td>
                        </tr>
                        <tr>
                            <td style="font-size: 11px;">Q'ty</td>
                            <td class="qty-text" style="width: 30%;">${currentQty} <span style="font-size: 12px; font-weight: normal;">Pcs.</span></td>
                            <td style="width: 20%; font-size: 11px;">Stamp Mark</td>
                            <td style="width: 28%;"></td>
                        </tr>
                        <tr>
                            <td style="font-size: 9px;">Production Data/Lot No.:</td>
                            <td class="fw-bold" style="font-size: 11px;">${data.lotNo}</td>
                            <td style="font-size: 11px;">STAM Code</td>
                            <td class="code-text text-center">${data.code}</td>
                        </tr>
                        <tr>
                            <td style="font-size: 9px;">Production Date</td>
                            <td style="font-size: 9px;">Supplier Check</td>
                            <td style="font-size: 9px;">Delivery Date</td>
                            <td class="fw-bold text-center" style="font-size: 9px;">STAM QC Receiving</td>
                        </tr>
                        <!-- แถวช่องว่างสำหรับปั๊มตรา/เซ็นชื่อ (แถวที่ 1) -->
                        <tr style="height: 18px;">
                            <td></td>
                            <td></td>
                            <td></td>
                            <td></td>
                        </tr>
                        <!-- แถว Time / by. -->
                        <tr>
                            <td style="font-size: 9px;">Time</td>
                            <td style="font-size: 9px;">Time</td>
                            <td style="font-size: 9px;">Time</td>
                            <td style="font-size: 9px;">by.</td>
                        </tr>
                        <!-- แถวช่องว่างโล่งๆ ด้านล่างสุด (ก่อนถึงขอบบาร์โค้ด) -->
                        <tr style="height: 22px;">
                            <td></td>
                            <td></td>
                            <td></td>
                            <td></td>
                        </tr>
                    </table>

                    <div class="bottom-section">
                        <div class="logo-stem">STEM</div>
                        <div class="barcode-container">
                            <svg id="barcode_${i}"></svg>
                        </div>
                    </div>
                `;

                currentContainer.appendChild(tagCard);

                setTimeout(() => {
                    JsBarcode(`#barcode_${i}`, data.partNo, {
                        format: "CODE128",
                        height: 26,
                        width: 1.3,
                        displayValue: false,
                        margin: 0
                    });
                }, 50);
            }
        }

        window.onload = generateTags;
    </script>
</body>
</html>
