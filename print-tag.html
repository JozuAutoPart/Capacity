<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>Print STEM Tags (6 Tags / A4 Landscape)</title>
    <!-- โหลดไลบรารี JsBarcode สำหรับสร้าง 1D Barcode -->
    <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>
    <style>
        @page {
            size: A4 landscape;
            margin: 0;
        }
        body {
            font-family: 'Tahoma', sans-serif;
            background: #eee;
            margin: 0;
            padding: 10px;
        }
        .no-print-bar {
            background: #333;
            color: #fff;
            padding: 10px 20px;
            margin-bottom: 15px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .page {
            width: 297mm;
            height: 210mm;
            padding: 6mm 8mm;
            margin: 0 auto 10px auto;
            background: white;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            box-sizing: border-box;
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            grid-template-rows: repeat(3, 1fr);
            gap: 4mm;
            page-break-after: always;
            page-break-inside: avoid;
        }
        @media print {
            body { background: none; padding: 0; }
            .no-print-bar { display: none !important; }
            .page { box-shadow: none; margin: 0; width: 297mm; height: 210mm; }
        }

        /* โครงสร้างป้าย Tag */
        .tag-card {
            border: 1.5px solid #000;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 2px;
            background: #fff;
            font-size: 11px;
            position: relative;
        }

        .tag-table {
            width: 100%;
            border-collapse: collapse;
            table-layout: fixed;
        }

        .tag-table td, .tag-table th {
            border: 1px solid #000;
            padding: 2px 4px;
            vertical-align: middle;
            word-wrap: break-word;
        }

        .fw-bold { font-weight: bold; }
        .text-center { text-align: center; }

        .part-no-text {
            font-size: 20px;
            font-weight: 900;
            letter-spacing: 0.5px;
        }

        .qty-text {
            font-size: 18px;
            font-weight: bold;
        }

        .code-text {
            font-size: 16px;
            font-weight: bold;
        }

        /* โซนด้านล่าง (Logo + Barcode) */
        .bottom-section {
            display: flex;
            align-items: center;
            border-top: 1px solid #000;
            padding-top: 2px;
            margin-top: 2px;
        }

        .logo-stem {
            font-size: 16px;
            font-style: italic;
            font-weight: 900;
            padding-left: 5px;
            width: 20%;
        }

        .barcode-container {
            width: 80%;
            text-align: center;
            padding-right: 5px;
        }

        .barcode-container svg {
            width: 100%;
            height: 35px;
        }
    </style>
</head>
<body>

    <div class="no-print-bar">
        <div>
            <button onclick="window.print()" style="padding: 8px 16px; background: #28a745; color: white; border: none; border-radius: 4px; font-weight: bold; cursor: pointer;">
                🖨️ พิมพ์ใบ Tag ทั้งหมด (แนวนอน)
            </button>
            <span id="tagSummary" style="margin-left: 15px; font-weight: bold;"></span>
        </div>
    </div>

    <div id="printContainer"></div>

    <script>
        function getUrlParams() {
            const params = new URLSearchParams(window.location.search);
            return {
                partNo: params.get('partNo') || '55366-KK020',
                partName: params.get('partName') || 'BRACKET, FINISH PANEL MOUNTING, NO.1',
                qty: parseInt(params.get('qty')) || 50,
                totalOrder: parseInt(params.get('totalOrder')) || parseInt(params.get('qty')) || 50,
                lotNo: params.get('lotNo') || '1037601',
                code: params.get('code') || 'JA269',
                date: params.get('date') || new Date().toISOString().split('T')[0]
            };
        }

        function generateTags() {
            const data = getUrlParams();
            
            // --- ลอจิกการคำนวณเดิมคงไว้ทั้งหมด ---
            const stdPack = data.qty;
            const totalOrder = data.totalOrder;
            const fullTags = Math.floor(totalOrder / stdPack);
            const remainder = totalOrder % stdPack;
            const totalTags = fullTags + (remainder > 0 ? 1 : 0);

            const container = document.getElementById('printContainer');
            document.getElementById('tagSummary').innerText = `Part No: ${data.partNo} | Qty/Tag: ${stdPack} | Total Order: ${totalOrder.toLocaleString()} | Total Tags: ${totalTags} ใบ`;

            container.innerHTML = '';
            let currentContainer = null;

            for (let i = 1; i <= totalTags; i++) {
                if ((i - 1) % 6 === 0) {
                    currentContainer = document.createElement('div');
                    currentContainer.className = 'page';
                    container.appendChild(currentContainer);
                }

                // คำนวณจำนวนในแต่ละแท็ก (แท็กสุดท้ายถ้ามีเศษจะแสดงยอดเศษ)
                const currentQty = (i === totalTags && remainder > 0) ? remainder : stdPack;

                const tagCard = document.createElement('div');
                tagCard.className = 'tag-card';
                tagCard.innerHTML = `
                    <table class="tag-table">
                        <tr>
                            <td style="width: 25%;">Part No.</td>
                            <td colspan="3" class="part-no-text">${data.partNo}</td>
                        </tr>
                        <tr>
                            <td>Part Name</td>
                            <td colspan="3" class="fw-bold" style="font-size: 11px;">${data.partName}</td>
                        </tr>
                        <tr>
                            <td>Q'ty</td>
                            <td class="qty-text" style="width: 30%;">${currentQty} <span style="font-size: 12px; font-weight: normal;">Pcs.</span></td>
                            <td style="width: 20%;">Stamp Mark</td>
                            <td style="width: 25%;"></td>
                        </tr>
                        <tr>
                            <td style="font-size: 9px;">Production Data/Lot No.:</td>
                            <td class="fw-bold">${data.lotNo}</td>
                            <td>STAM Code</td>
                            <td class="code-text text-center">${data.code}</td>
                        </tr>
                        <tr>
                            <td>Production Date</td>
                            <td>Supplier Check</td>
                            <td>Delivery Date</td>
                            <td class="fw-bold text-center" style="font-size: 9px;">STAM QC Receiving</td>
                        </tr>
                        <tr style="height: 25px;">
                            <td>Time</td>
                            <td>Time</td>
                            <td>Time</td>
                            <td>by.</td>
                        </tr>
                    </table>

                    <div class="bottom-section">
                        <div class="logo-stem">STEM</div>
                        <div class="barcode-container">
                            <svg id="barcode_${i}"></svg>
                        </div>
                    </div>
                `;

                currentContainer.appendChild(tagCard);

                // เจนเนอเรต Barcode
                setTimeout(() => {
                    JsBarcode(`#barcode_${i}`, data.partNo, {
                        format: "CODE128",
                        height: 32,
                        width: 1.4,
                        displayValue: false,
                        margin: 0
                    });
                }, 50);
            }
        }

        window.onload = generateTags;
    </script>
</body>
</html>
