<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Production Planning & Capacity Management System - Jozu Auto Part Co., Ltd.</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-100 font-sans antialiased">

    <!-- Header / Navbar -->
    <header class="bg-indigo-900 text-white shadow-md">
        <div class="container mx-auto px-6 py-4 flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <i class="fa-solid fa-industry text-2xl text-indigo-400"></i>
                <div>
                    <h1 class="text-xl font-bold">Jozu Auto Part Co., Ltd.</h1>
                    <p class="text-xs text-indigo-300">Production Planning & Capacity Management System</p>
                </div>
            </div>
            <div>
                <span class="text-sm bg-indigo-800 px-3 py-1.5 rounded-lg border border-indigo-700">
                    <i class="fa-solid fa-user-gear mr-1"></i> Planner User
                </span>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="container mx-auto px-6 py-8">
        
        <!-- Action Control Bar -->
        <div class="bg-white rounded-xl shadow-sm p-4 mb-6 flex flex-wrap justify-between items-center gap-4">
            <div>
                <h2 class="text-lg font-semibold text-gray-800"><i class="fa-solid fa-table-list mr-2 text-indigo-600"></i>ตารางวางแผนการผลิตประจำวัน</h2>
                <p class="text-sm text-gray-500">จัดการข้อมูลและคำนวณกำลังการผลิตในหน้านี้</p>
            </div>
            <div class="flex items-center space-x-3">
                <!-- ปุ่มล้างข้อมูล (มีระบบใส่รหัสผ่าน) -->
                <button onclick="promptClearData()" class="bg-red-50 hover:bg-red-100 text-red-600 border border-red-200 px-4 py-2 rounded-lg text-sm font-medium transition flex items-center">
                    <i class="fa-solid fa-trash-can mr-2"></i> ล้างข้อมูลหน้าจอ
                </button>
                <button onclick="saveData()" class="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded-lg text-sm font-medium transition flex items-center shadow-sm">
                    <i class="fa-solid fa-floppy-disk mr-2"></i> บันทึกข้อมูล
                </button>
            </div>
        </div>

        <!-- Form / Input Section -->
        <div class="bg-white rounded-xl shadow-sm p-6 mb-6">
            <h3 class="text-md font-semibold text-gray-700 mb-4 pb-2 border-b"><i class="fa-solid fa-pen-to-square mr-2 text-indigo-600"></i>กรอกข้อมูลการผลิต</h3>
            <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
                <div>
                    <label class="block text-xs font-medium text-gray-600 mb-1">รหัสสินค้า (Part No.)</label>
                    <input type="text" id="partNo" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none" placeholder="เช่น JZ-8821">
                </div>
                <div>
                    <label class="block text-xs font-medium text-gray-600 mb-1">ชื่อชิ้นส่วน (Part Name)</label>
                    <input type="text" id="partName" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none" placeholder="เช่น Bracket Assy">
                </div>
                <div>
                    <label class="block text-xs font-medium text-gray-600 mb-1">จำนวนแผนการผลิต (Plan Qty)</label>
                    <input type="number" id="planQty" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none" placeholder="0">
                </div>
                <div class="flex items-end">
                    <button onclick="addRow()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white py-2 rounded-lg text-sm font-medium transition flex items-center justify-center shadow-sm">
                        <i class="fa-solid fa-plus mr-1"></i> เพิ่มรายการ
                    </button>
                </div>
            </div>
        </div>

        <!-- Data Table Section -->
        <div class="bg-white rounded-xl shadow-sm overflow-hidden">
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-gray-50 text-gray-600 text-xs uppercase tracking-wider border-b">
                            <th class="py-3 px-4 font-semibold">No.</th>
                            <th class="py-3 px-4 font-semibold">Part No.</th>
                            <th class="py-3 px-4 font-semibold">Part Name</th>
                            <th class="py-3 px-4 font-semibold text-right">Plan Qty</th>
                            <th class="py-3 px-4 font-semibold text-center">จัดการ</th>
                        </tr>
                    </thead>
                    <tbody id="dataTableBody" class="divide-y divide-gray-200 text-sm text-gray-700">
                        <!-- แถวตัวอย่างข้อมูลเริ่มต้น -->
                        <tr>
                            <td class="py-3 px-4">1</td>
                            <td class="py-3 px-4 font-medium">JZ-1001</td>
                            <td class="py-3 px-4">Engine Bracket</td>
                            <td class="py-3 px-4 text-right">1,200</td>
                            <td class="py-3 px-4 text-center">
                                <button onclick="deleteRow(this)" class="text-red-500 hover:text-red-700 text-xs"><i class="fa-solid fa-trash"></i></button>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

    </main>

    <!-- JavaScript สำหรับควบคุมระบบและรหัสผ่าน -->
    <script>
        // กำหนดรหัสผ่านสำหรับล้างข้อมูล (สามารถเปลี่ยนรหัสผ่านได้ที่นี่)
        const CLEAR_PASSWORD = "admin";

        // ฟังก์ชันตรวจสอบรหัสผ่านก่อนล้างข้อมูลเฉพาะหน้า
        function promptClearData() {
            let password = prompt("⚠️ คำเตือน: การล้างข้อมูลจะลบรายการทั้งหมดในหน้าจอ\nกรุณากรอกรหัสผ่านเพื่อยืนยัน:");
            
            if (password === null) {
                return; // ผู้ใช้กดยกเลิก
            }

            if (password === CLEAR_PASSWORD) {
                clearPageData();
                alert("✅ ล้างข้อมูลในหน้าจอเรียบร้อยแล้ว");
            } else {
                alert("❌ รหัสผ่านไม่ถูกต้อง! ไม่อนุญาตให้ล้างข้อมูล");
            }
        }

        // ฟังก์ชันล้างข้อมูลเฉพาะหน้าจอ (ฟอร์ม และ ตาราง)
        function clearPageData() {
            // ล้างค่าในช่องกรอกฟอร์ม
            document.getElementById('partNo').value = '';
            document.getElementById('partName').value = '';
            document.getElementById('planQty').value = '';

            // ล้างข้อมูลในตารางทั้งหมด
            document.getElementById('dataTableBody').innerHTML = '';
        }

        // ฟังก์ชันเพิ่มแถวข้อมูลจำลอง
        function addRow() {
            let partNo = document.getElementById('partNo').value;
            let partName = document.getElementById('partName').value;
            let planQty = document.getElementById('planQty').value;

            if (!partNo || !partName || !planQty) {
                alert("กรุณากรอกข้อมูลให้ครบถ้วนก่อนเพิ่มรายการ");
                return;
            }

            let tbody = document.getElementById('dataTableBody');
            let rowCount = tbody.rows.length + 1;

            let row = document.createElement('tr');
            row.innerHTML = `
                <td class="py-3 px-4">${rowCount}</td>
                <td class="py-3 px-4 font-medium">${partNo}</td>
                <td class="py-3 px-4">${partName}</td>
                <td class="py-3 px-4 text-right">${Number(planQty).toLocaleString()}</td>
                <td class="py-3 px-4 text-center">
                    <button onclick="deleteRow(this)" class="text-red-500 hover:text-red-700 text-xs"><i class="fa-solid fa-trash"></i></button>
                </td>
            `;
            tbody.appendChild(row);

            // เคลียร์ช่องกรอกหลังเพิ่ม
            document.getElementById('partNo').value = '';
            document.getElementById('partName').value = '';
            document.getElementById('planQty').value = '';
        }

        // ฟังก์ชันลบแถวทีละรายการ
        function deleteRow(btn) {
            let row = btn.closest('tr');
            row.remove();
            updateRowNumbers();
        }

        // อัปเดตลำดับแถวในตารางใหม่
        function updateRowNumbers() {
            let rows = document.querySelectorAll('#dataTableBody tr');
            rows.forEach((row, index) => {
                row.cells[0].innerText = index + 1;
            });
        }

        function saveData() {
            alert("💾 บันทึกข้อมูลเข้าสู่ระบบเรียบร้อยแล้ว");
        }
    </script>
</body>
</html>
