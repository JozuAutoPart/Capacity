<div class="bg-white p-6 rounded-lg shadow-md mt-6">
    <h2 class="text-xl font-semibold text-gray-700 mb-4">➕ เพิ่มข้อมูลคำนวณ Capacity เครื่องจักร</h2>
    <form id="capacityForm" class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div>
            <label class="block text-sm font-medium text-gray-600">รหัสเครื่องจักร</label>
            <input type="text" id="machineCode" required class="w-full border rounded p-2 mt-1" placeholder="เช่น MC-001">
        </div>
        <div>
            <label class="block text-sm font-medium text-gray-600">ชื่อเครื่องจักร</label>
            <input type="text" id="machineName" required class="w-full border rounded p-2 mt-1" placeholder="เช่น CNC Machine 1">
        </div>
        <div>
            <label class="block text-sm font-medium text-gray-600">เวลาทำงานต่อวัน (ชม.)</label>
            <input type="number" step="0.1" id="dailyHours" value="8" required class="w-full border rounded p-2 mt-1">
        </div>
        <div>
            <label class="block text-sm font-medium text-gray-600">เวลาซ่อมบำรุง/หยุด (ชม.)</label>
            <input type="number" step="0.1" id="downtime" value="1" required class="w-full border rounded p-2 mt-1">
        </div>
        <div>
            <label class="block text-sm font-medium text-gray-600">ประสิทธิภาพเครื่อง (เช่น 0.85 = 85%)</label>
            <input type="number" step="0.01" id="efficiency" value="0.85" required class="w-full border rounded p-2 mt-1">
        </div>
        <div>
            <label class="block text-sm font-medium text-gray-600">จำนวนชิ้นงานที่ต้องผลิต (Target Qty)</label>
            <input type="number" id="targetQty" required class="w-full border rounded p-2 mt-1" placeholder="เช่น 50">
        </div>
        <div class="md:col-span-2">
            <label class="block text-sm font-medium text-gray-600">Cycle Time (นาที/ชิ้น)</label>
            <input type="number" step="0.1" id="cycleTime" required class="w-full border rounded p-2 mt-1" placeholder="เช่น 5.0">
        </div>
        <div class="md:col-span-2">
            <button type="submit" class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700 w-full">คำนวณและบันทึกลง Google Sheets</button>
        </div>
    </form>
</div>

<script>
    const scriptURL = https://script.google.com/macros/s/AKfycbxizb7qREyore3QD7vENdQBhCpr64olCc3BCQjb_77DfRHMKbegrW-FLczVeIMnrsk/exec

    document.getElementById('capacityForm').addEventListener('submit', e => {
        e.preventDefault();
        
        const data = {
            machineCode: document.getElementById('machineCode').value,
            machineName: document.getElementById('machineName').value,
            dailyHours: document.getElementById('dailyHours').value,
            downtime: document.getElementById('downtime').value,
            efficiency: document.getElementById('efficiency').value,
            targetQty: document.getElementById('targetQty').value,
            cycleTime: document.getElementById('cycleTime').value
        };

        fetch(scriptURL, { method: 'POST', body: JSON.stringify(data) })
            .then(response => alert('บันทึกข้อมูลเรียบร้อย!'))
            .catch(error => alert('เกิดข้อผิดพลาด: ' + error.message));
    });
</script>
