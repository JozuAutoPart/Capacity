        @page {
            size: A4 landscape;
            margin: 8mm;
        }
        body {
            font-family: 'Tahoma', sans-serif;
            background: #eee;
            margin: 0;
            padding: 20px;
        }
        .page {
            width: 297mm;
            min-height: 210mm;
            padding: 8mm;
            margin: 0 auto 20px auto;
            background: white;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            box-sizing: border-box;
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            grid-template-rows: repeat(3, 1fr);
            gap: 6mm;
        }
        @media print {
            body { background: none; padding: 0; }
            .page { box-shadow: none; margin: 0; page-break-after: always; }
            .no-print { display: none; }
        }
        .tag-card {
            border: 2px solid #000;
            padding: 5px;
            box-sizing: border-box;
            font-size: 10px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            background: #fff;
            height: 60mm;
        }
        table.tag-table {
            width: 100%;
            border-collapse: collapse;
            border: 1px solid #000;
            table-layout: fixed;
        }
        table.tag-table th, table.tag-table td {
            border: 1px solid #000;
            padding: 2px 4px;
            vertical-align: middle;
            overflow: hidden;
        }
        .label-title { font-weight: bold; }
        .text-center { text-align: center; }
        .fw-bold { font-weight: bold; }
        .footer-section {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 2px;
        }
        .logo-box {
            font-weight: bold;
            font-style: italic;
            font-size: 14px;
            color: #003366;
            font-family: 'Arial Black', sans-serif;
        }
        .barcode-box {
            text-align: center;
            flex-grow: 1;
            margin-left: 10px;
            margin-right: 10px;
        }
        .barcode-box svg {
            max-height: 35px;
            width: 100%;
        }
    </style>
</head>

        async function initTagPage() {
            const urlParams = new URLSearchParams(window.location.search);
            const partNo = (urlParams.get('partNo') || '').trim();
            const lotNo = urlParams.get('lotNo') || '-';
            const totalQty = Number(urlParams.get('qty')) || 0;

            let partName = '-';
            let stemCode = '-';
            let pcsPerTag = 50;

            if (partDatabase[partNo]) {
                partName = partDatabase[partNo].name;
                stemCode = partDatabase[partNo].stem;
                pcsPerTag = partDatabase[partNo].pcs;
            } else {
                partName = urlParams.get('partName') || '-';
                stemCode = urlParams.get('stemCode') || '-';
                pcsPerTag = Number(urlParams.get('pcs')) || 50;
            }

            generateTagsUI({
                partNo: partNo || '-',
                lotNo: lotNo,
                totalQty: totalQty,
                pcsPerTag: pcsPerTag,
                partName: partName,
                stemCode: stemCode
            });
        }

        function generateTagsUI(printData) {
            const container = document.getElementById('tagContainer');
            container.innerHTML = '';

            const totalTags = Math.ceil(printData.totalQty / printData.pcsPerTag);
            
            document.getElementById('tagInfoSummary').innerText = `Part No: ${printData.partNo} | Part Name: ${printData.partName} | STEM: ${printData.stemCode} | จำนวน/ใบ: ${printData.pcsPerTag} | ยอดรวม: ${printData.totalQty.toLocaleString()} Pcs (${totalTags} ใบ)`;

            let allTagsHTML = '';
            let currentA4PageHTML = '';

            for (let i = 1; i <= totalTags; i++) {
                let currentQty = printData.pcsPerTag;
                if (i === totalTags) {
                    let remainder = printData.totalQty % printData.pcsPerTag;
                    if (remainder > 0) currentQty = remainder;
                }

                const tagHTML = `
                    <div class="tag-card">
                        <table class="tag-table">
                            <colgroup>
                                <col style="width: 25%;">
                                <col style="width: 25%;">
                                <col style="width: 25%;">
                                <col style="width: 25%;">
                            </colgroup>
                            <tr>
                                <td class="label-title">Part No.</td>
                                <td colspan="3" class="fw-bold" style="font-size: 15px; letter-spacing: 0.5px;">${printData.partNo}</td>
                            </tr>
                            <tr>
                                <td class="label-title">Part Name</td>
                                <td colspan="3" class="fw-bold" style="font-size: 12px;">${printData.partName}</td>
                            </tr>
                            <tr>
                                <td class="label-title">Q'ty</td>
                                <td><span class="fw-bold" style="font-size: 13px;">${currentQty}</span> Pcs.</td>
                                <td class="label-title text-center">Stamp Mark</td>
                                <td></td>
                            </tr>
                            <tr>
                                <td class="label-title" style="font-size: 8.5px;">Production / Lot No.:</td>
                                <td>${printData.lotNo}</td>
                                <td class="label-title text-center">Code</td>
                                <td class="fw-bold" style="font-size: 11px;">${printData.stemCode}</td>
                            </tr>
                            <tr>
                                <td class="text-center fw-bold" style="font-size: 8px;">Production Date</td>
                                <td class="text-center fw-bold" style="font-size: 8px;">Supplier Check</td>
                                <td class="text-center fw-bold" style="font-size: 8px;">Delivery Date</td>
                                <td class="text-center fw-bold" style="font-size: 8px;">QC Receiving</td>
                            </tr>
                            <tr>
                                <td style="height: 9mm;"></td>
                                <td></td>
                                <td></td>
                                <td></td>
                            </tr>
                            <tr>
                                <td class="text-center" style="font-size: 8px;">Time</td>
                                <td class="text-center" style="font-size: 8px;">Time</td>
                                <td class="text-center" style="font-size: 8px;">Time</td>
                                <td class="text-center" style="font-size: 8px;">by.</td>
                            </tr>
                        </table>
                        <div class="footer-section">
                            <div class="logo-box">${printData.customer || 'STEM'}</div>
                            <div class="barcode-box">
                                <svg class="barcode" data-barcode="${printData.partNo}"></svg>
                            </div>
                            <div style="font-size: 8px; text-align: right;"></div>
                        </div>
                    </div>
                `;

                currentA4PageHTML += tagHTML;

                if (i % 6 === 0 || i === totalTags) {
                    allTagsHTML += `<div class="page">${currentA4PageHTML}</div>`;
                    currentA4PageHTML = ''; 
                }
            }

            container.innerHTML = allTagsHTML;

            document.querySelectorAll('.barcode').forEach(svg => {
                JsBarcode(svg, svg.getAttribute('data-barcode'), {
                    format: "CODE128",
                    displayValue: false,
                    width: 1.8,
                    height: 28,
                    margin: 1
                });
            });
        }

        window.onload = initTagPage;
    </script>
