<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>Print STEM Tags (6 Tags / A4 Landscape)</title>
    <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>
    <style>
        @page {
            size: A4 landscape;
            margin: 8mm;
        }
        body {
            font-family: 'Tahoma', sans-serif;
            background: #eee;
            margin: 0;
            padding: 20px;
        }
        .page {
            width: 297mm;
            min-height: 210mm;
            padding: 8mm;
            margin: 0 auto 20px auto;
            background: white;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            box-sizing: border-box;
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            grid-template-rows: repeat(3, 1fr);
            gap: 6mm;
        }
        @media print {
            body { background: none; padding: 0; }
            .page { box-shadow: none; margin: 0; page-break-after: always; }
            .no-print { display: none; }
        }
        .tag-card {
            border: 2px solid #000;
            padding: 5px;
            box-sizing: border-box;
            font-size: 10px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            background: #fff;
            height: 60mm;
        }
        table.tag-table {
            width: 100%;
            border-collapse: collapse;
            border: 1px solid #000;
        }
        table.tag-table th, table.tag-table td {
            border: 1px solid #000;
            padding: 2px 4px;
            vertical-align: middle;
        }
        .label-title { font-weight: bold; }
        .text-center { text-align: center; }
        .fw-bold { font-weight: bold; }
        .footer-section {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 2px;
        }
        .logo-box {
            font-weight: bold;
            font-style: italic;
            font-size: 14px;
            color: #003366;
            font-family: 'Arial Black', sans-serif;
        }
        .barcode-box {
            text-align: center;
            flex-grow: 1;
            margin-left: 10px;
            margin-right: 10px;
        }
        .barcode-box svg {
            max-height: 35px;
            width: 100%;
        }
    </style>
</head>
<body>

    <div class="no-print" style="text-align: center; margin-bottom: 20px;">
        <button onclick="window.print()" style="padding: 10px 20px; font-size: 16px; background: #28a745; color: white; border: none; cursor: pointer; border-radius: 5px;">
            🖨️ พิมพ์ใบ Tag ทั้งหมด (แนวนอน)
        </button>
        <span id="tagInfoSummary" style="margin-left: 15px; font-weight: bold; color: #333;">กำลังโหลดข้อมูลจาก MasterParts...</span>
    </div>

    <div id="tagContainer"></div>

    <script>
        async function initTagPage() {
            const urlParams = new URLSearchParams(window.location.search);
            const targetPartNo = (urlParams.get('partNo') || '').trim();
            const lotNo = urlParams.get('lotNo') || '-';
            const totalQty = Number(urlParams.get('qty')) || 0;
            const pcsPerTag = Number(urlParams.get('pcsPerTag')) || 50;

            let partName = urlParams.get('partName') || '-';
            let stemCode = urlParams.get('stemCode') || '-';

            // ถ้าไม่ได้ส่งชื่อมาทาง URL ให้ดึงผ่าน Google Apps Service (JSONP / Public API) หรือดึงจากตารางโดยตรง
            try {
                const sheetId = '1rCouYPQOq3G-C8SM1UwHPP1MneohkVmlPrbGbWus';
                const url = `https://docs.google.com/spreadsheets/d/${sheetId}/gviz/tq?tqx=out:json&sheet=MasterParts`;
                
                const res = await fetch(url);
                const text = await res.text();
                // ตัด Text ข้อมูล gviz ของ Google ให้กลายเป็น JSON แท้ๆ
                const json = JSON.parse(text.substring(47, text.length - 2));
                const rows = json.table.rows;

                for (let r of rows) {
                    const c = r.c;
                    // c[1] คือคอลัมน์ B (partNo), c[7] คือคอลัมน์ H (Part Name), c[8] คือคอลัมน์ I (STEM Code)
                    if (c[1] && c[1].v && c[1].v.toString().trim() === targetPartNo) {
                        if (c[7] && c[7].v) partName = c[7].v.toString();
                        if (c[8] && c[8].v) stemCode = c[8].v.toString();
                        break;
                    }
                }
            } catch (e) {
                console.log('ดึงข้อมูลผ่าน JSON ไม่สำเร็จ ใช้ค่าสำรอง', e);
            }

            generateTagsUI({
                partNo: targetPartNo || '-',
                lotNo: lotNo,
                totalQty: totalQty,
                pcsPerTag: pcsPerTag,
                partName: partName,
                stemCode: stemCode
            });
        }

        function generateTagsUI(printData) {
            const container = document.getElementById('tagContainer');
            container.innerHTML = '';

            const totalTags = Math.ceil(printData.totalQty / printData.pcsPerTag);
            
            document.getElementById('tagInfoSummary').innerText = `Part No: ${printData.partNo} | Part Name: ${printData.partName} | STEM: ${printData.stemCode} | ยอดรวม: ${printData.totalQty.toLocaleString()} Pcs (${totalTags} ใบ)`;

            let allTagsHTML = '';
            let currentA4PageHTML = '';

            for (let i = 1; i <= totalTags; i++) {
                let currentQty = printData.pcsPerTag;
                if (i === totalTags) {
                    let remainder = printData.totalQty % printData.pcsPerTag;
                    if (remainder > 0) currentQty = remainder;
                }

                const tagHTML = `
                    <div class="tag-card">
                        <table class="tag-table">
                            <tr>
                                <td class="label-title" style="width: 18%;">Part No.</td>
                                <td colspan="3" class="fw-bold" style="font-size: 12px; width: 82%;">${printData.partNo}</td>
                            </tr>
                            <tr>
                                <td class="label-title">Part Name</td>
                                <td colspan="3">${printData.partName}</td>
                            </tr>
                            <tr>
                                <td class="label-title">Q'ty</td>
                                <td style="width: 40%;"><span class="fw-bold" style="font-size: 13px;">${currentQty}</span> Pcs.</td>
                                <td class="label-title text-center" style="width: 18%;">Stamp Mark</td>
                                <td style="width: 24%;"></td>
                            </tr>
                            <tr>
                                <td class="label-title" style="font-size: 9px;">Production Data / Lot No.:</td>
                                <td style="width: 20%;">${printData.lotNo}</td>
                                <td class="label-title text-center" style="width: 18%;">STEM Code</td>
                                <td style="width: 24%;">${printData.stemCode}</td>
                            </tr>
                            <tr>
                                <td class="text-center fw-bold" style="font-size: 8.5px;">Production Date</td>
                                <td class="text-center fw-bold" style="font-size: 8.5px;">Supplier Check</td>
                                <td class="text-center fw-bold" style="font-size: 8.5px;">Delivery Date</td>
                                <td class="text-center fw-bold" style="font-size: 8.5px;">STEM QC Receiving</td>
                            </tr>
                            <tr>
                                <td style="height: 10mm;"></td>
                                <td></td>
                                <td></td>
                                <td></td>
                            </tr>
                            <tr>
                                <td class="text-center" style="font-size: 8.5px;">Time</td>
                                <td class="text-center" style="font-size: 8.5px;">Time</td>
                                <td class="text-center" style="font-size: 8.5px;">Time</td>
                                <td class="text-center" style="font-size: 8.5px;">by.</td>
                            </tr>
                        </table>
                        <div class="footer-section">
                            <div class="logo-box">STEM</div>
                            <div class="barcode-box">
                                <svg class="barcode" data-barcode="${printData.partNo}"></svg>
                            </div>
                            <div style="font-size: 8px; text-align: right;"></div>
                        </div>
                    </div>
                `;

                currentA4PageHTML += tagHTML;

                if (i % 6 === 0 || i === totalTags) {
                    allTagsHTML += `<div class="page">${currentA4PageHTML}</div>`;
                    currentA4PageHTML = ''; 
                }
            }

            container.innerHTML = allTagsHTML;

            document.querySelectorAll('.barcode').forEach(svg => {
                JsBarcode(svg, svg.getAttribute('data-barcode'), {
                    format: "CODE128",
                    displayValue: false,
                    width: 1.8,
                    height: 28,
                    margin: 1
                });
            });
        }

        window.onload = initTagPage;
    </script>
</body>
</html>
