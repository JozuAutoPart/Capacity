<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>Print STEM Tags (6 Tags / A4 Landscape)</title>
    <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>
    <style>
        @page {
            size: A4 landscape;
            margin: 8mm;
        }
        body {
            font-family: 'Tahoma', sans-serif;
            background: #eee;
            margin: 0;
            padding: 20px;
        }
        .page {
            width: 297mm;
            min-height: 210mm;
            padding: 8mm;
            margin: 0 auto 20px auto;
            background: white;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            box-sizing: border-box;
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            grid-template-rows: repeat(3, 1fr);
            gap: 6mm;
        }
        @media print {
            body { background: none; padding: 0; }
            .page { box-shadow: none; margin: 0; page-break-after: always; }
            .no-print { display: none; }
        }
        .tag-card {
            border: 2px solid #000;
            padding: 5px;
            box-sizing: border-box;
            font-size: 10px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            background: #fff;
            height: 60mm;
        }
        table.tag-table {
            width: 100%;
            border-collapse: collapse;
            border: 1px solid #000;
        }
        table.tag-table th, table.tag-table td {
            border: 1px solid #000;
            padding: 2px 4px;
            vertical-align: middle;
        }
        .label-title { font-weight: bold; }
        .text-center { text-align: center; }
        .fw-bold { font-weight: bold; }
        .footer-section {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 2px;
        }
        .logo-box {
            font-weight: bold;
            font-style: italic;
            font-size: 14px;
            color: #003366;
            font-family: 'Arial Black', sans-serif;
        }
        .barcode-box {
            text-align: center;
            flex-grow: 1;
            margin-left: 10px;
            margin-right: 10px;
        }
        .barcode-box svg {
            max-height: 35px;
            width: 100%;
        }
    </style>
</head>
<body>

    <div class="no-print" style="text-align: center; margin-bottom: 20px;">
        <button onclick="window.print()" style="padding: 10px 20px; font-size: 16px; background: #28a745; color: white; border: none; cursor: pointer; border-radius: 5px;">
            🖨️ พิมพ์ใบ Tag ทั้งหมด (แนวนอน)
        </button>
        <span id="tagInfoSummary" style="margin-left: 15px; font-weight: bold; color: #333;">กำลังสร้างใบ Tag...</span>
    </div>

    <div id="tagContainer"></div>

    <script>
        const SHEET_CSV_URL = 'https://docs.google.com/spreadsheets/d/1rCouYPQOq3G-C8SM1UwHPP1MneohkVmlPrbGbWus/gviz/tq?tqx=out:csv&sheet=MasterParts';

        async function initTagPage() {
            const urlParams = new URLSearchParams(window.location.search);
            const targetPartNo = (urlParams.get('partNo') || '').trim();
            const lotNo = urlParams.get('lotNo') || '-';
            const totalQty = Number(urlParams.get('qty')) || 0;
            const pcsPerTag = Number(urlParams.get('pcsPerTag')) || 50;

            let partName = urlParams.get('partName') || '-';
            let stemCode = urlParams.get('stemCode') || '-';

            try {
                const response = await fetch(SHEET_CSV_URL);
                if (response.ok) {
                    const csvText = await response.text();
                    const rows = parseCSV(csvText);
                    for (let row of rows) {
                        const partNoCol = (row[1] || '').trim(); // คอลัมน์ B
                        if (partNoCol === targetPartNo) {
                            if (row[7]) partName = row[7].trim(); // คอลัมน์ H
                            if (row[8]) stemCode = row[8].trim(); // คอลัมน์ I
                            break;
                        }
                    }
                }
            } catch (error) {
                console.log('ใช้ค่าจาก URL พารามิเตอร์แทน', error);
            }

            generateTagsUI({
                partNo: targetPartNo || '-',
                lotNo: lotNo,
                totalQty: totalQty,
                pcsPerTag: pcsPerTag,
                partName: partName,
                stemCode: stemCode
            });
        }

        function parseCSV(text) {
            let lines = text.split('\n');
            let result = [];
            for (let i = 0; i < lines.length; i++) {
                let row = [];
                let current = '';
                let inQuote = false;
                for (let j = 0; j < lines[i].length; j++) {
                    let char = lines[i][j];
                    if (char === '"') {
                        inQuote = !inQuote;
                    } else if (char === ',' && !inQuote) {
                        row.push(current.replace(/^"|"$/g, '').trim());
                        current = '';
                    } else {
                        current += char;
                    }
                }
                row.push(current.replace(/^"|"$/g, '').trim());
                result.push(row);
            }
            return result;
        }

        function generateTagsUI(printData) {
            const container = document.getElementById('tagContainer');
            container.innerHTML = '';

            const totalTags = Math.ceil(printData.totalQty / printData.pcsPerTag);
            
            // แก้ไขจุดที่พิมพ์ตกหล่นให้แสดงผลตัวอักษรถูกต้อง
            document.getElementById('tagInfoSummary').innerText = `Part No: ${printData.partNo} | Lot: ${printData.lotNo} | ยอดรวม: ${printData.totalQty.toLocaleString()} Pcs (${totalTags} ใบ | ใบละ ${printData.pcsPerTag} Pcs)`;

            let allTagsHTML = '';
            let currentA4PageHTML = '';

            for (let i = 1; i <= totalTags; i++) {
                let currentQty = printData.pcsPerTag;
                if (i === totalTags) {
                    let remainder = printData.totalQty % printData.pcsPerTag;
                    if (remainder > 0) currentQty = remainder;
                }

                const tagHTML = `
                    <div class="tag-card">
                        <table class="tag-table">
                            <tr>
                                <td class="label-title" style="width: 18%;">Part No.</td>
                                <td colspan="3" class="fw-bold" style="font-size: 12px; width: 82%;">${printData.partNo}</td>
                            </tr>
                            <tr>
                                <td class="label-title">Part Name</td>
                                <td colspan="3">${printData.partName}</td>
                            </tr>
                            <tr>
                                <td class="label-title">Q'ty</td>
                                <td style="width: 40%;"><span class="fw-bold" style="font-size: 13px;">${currentQty}</span> Pcs.</td>
                                <td class="label-title text-center" style="width: 18%;">Stamp Mark</td>
                                <td style="width: 24%;"></td>
                            </tr>
                            <tr>
                                <td class="label-title" style="font-size: 9px;">Production Data / Lot No.:</td>
                                <td style="width: 20%;">${printData.lotNo}</td>
                                <td class="label-title text-center" style="width: 18%;">STEM Code</td>
                                <td style="width: 24%;">${printData.stemCode}</td>
                            </tr>
                            <tr>
                                <td class="text-center fw-bold" style="font-size: 8.5px;">Production Date</td>
                                <td class="text-center fw-bold" style="font-size: 8.5px;">Supplier Check</td>
                                <td class="text-center fw-bold" style="font-size: 8.5px;">Delivery Date</td>
                                <td class="text-center fw-bold" style="font-size: 8.5px;">STEM QC Receiving</td>
                            </tr>
                            <tr>
                                <td style="height: 10mm;"></td>
                                <td></td>
                                <td></td>
                                <td></td>
                            </tr>
                            <tr>
                                <td class="text-center" style="font-size: 8.5px;">Time</td>
                                <td class="text-center" style="font-size: 8.5px;">Time</td>
                                <td class="text-center" style="font-size: 8.5px;">Time</td>
                                <td class="text-center" style="font-size: 8.5px;">by.</td>
                            </tr>
                        </table>
                        <div class="footer-section">
                            <div class="logo-box">STEM</div>
                            <div class="barcode-box">
                                <svg class="barcode" data-barcode="${printData.partNo}"></svg>
                            </div>
                            <div style="font-size: 8px; text-align: right;"></div>
                        </div>
                    </div>
                `;

                currentA4PageHTML += tagHTML;

                if (i % 6 === 0 || i === totalTags) {
                    allTagsHTML += `<div class="page">${currentA4PageHTML}</div>`;
                    currentA4PageHTML = ''; 
                }
            }

            container.innerHTML = allTagsHTML;

            document.querySelectorAll('.barcode').forEach(svg => {
                JsBarcode(svg, svg.getAttribute('data-barcode'), {
                    format: "CODE128",
                    displayValue: false,
                    width: 1.8,
                    height: 28,
                    margin: 1
                });
            });
        }

        window.onload = initTagPage;
    </script>
</body>
</html>
