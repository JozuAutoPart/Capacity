<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>Print Tag - Jozu Auto Part</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;700&display=swap');
        
        body {
            font-family: 'Sarabun', sans-serif;
            background-color: #525659;
            margin: 0;
            padding: 20px;
        }

        .no-print {
            margin-bottom: 20px;
        }

        .page {
            width: 297mm;
            height: 210mm;
            background: #fff;
            margin: 0 auto 20px auto;
            padding: 10mm;
            box-sizing: border-box;
            box-shadow: 0 0 10px rgba(0,0,0,0.3);
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(2, 1fr);
            gap: 10mm;
        }

        .tag-card {
            border: 2px solid #000;
            padding: 8px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-sizing: border-box;
            background: #fff;
            position: relative;
        }

        .tag-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #000;
            padding-bottom: 4px;
        }

        .tag-logo {
            font-weight: bold;
            font-size: 14px;
            color: #008000;
        }

        .tag-title {
            font-weight: bold;
            font-size: 12px;
            text-align: center;
        }

        .tag-body {
            font-size: 11px;
            margin-top: 5px;
        }

        .tag-body table {
            width: 100%;
            border-collapse: collapse;
        }

        .tag-body th, .tag-body td {
            border: 1px solid #000;
            padding: 3px 5px;
            text-align: left;
        }

        .tag-footer {
            text-align: center;
            margin-top: 5px;
        }

        @media print {
            body {
                background: none;
                padding: 0;
            }
            .no-print {
                display: none !important;
            }
            .page {
                box-shadow: none;
                margin: 0;
                page-break-after: always;
            }
        }
    </style>
</head>
<body>

    <div class="container text-center no-print">
        <div class="card p-3 bg-dark text-white d-flex flex-row justify-content-between align-items-center">
            <span id="tagInfo" class="fw-bold">กำลังโหลดข้อมูลแท็ก...</span>
            <div>
                <a href="index.html" class="btn btn-secondary btn-sm me-2">กลับหน้าหลัก</a>
                <button onclick="window.print()" class="btn btn-primary btn-sm">พิมพ์เอกสาร</button>
            </div>
        </div>
    </div>

    <div id="printContainer">
        <!-- หน้าแท็กจะถูกสร้างด้วย JavaScript -->
    </div>

    <script>
        window.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const partNo = urlParams.get('partNo') || 'TEST-PART';
            const partName = urlParams.get('partName') || 'ชื่อชิ้นงานทดสอบ';
            const qty = urlParams.get('qty') || '100';
            const lotNo = urlParams.get('lotNo') || '2609001';
            const totalTags = parseInt(urlParams.get('count')) || 6;

            document.getElementById('tagInfo').textContent = `พิมพ์ Tag: Part [${partNo}] จำนวน ${totalTags} ใบ`;

            const container = document.getElementById('printContainer');
            
            // สร้างหน้า A4 (1 หน้ามี 6 แท็ก)
            let tagsPerPage = 6;
            let totalPages = Math.ceil(totalTags / tagsPerPage);
            let currentTagCount = 0;

            for (let p = 0; p < totalPages; p++) {
                const pageDiv = document.createElement('div');
                pageDiv.className = 'page';

                for (let i = 0; i < tagsPerPage; i++) {
                    if (currentTagCount >= totalTags) break;

                    const tagDiv = document.createElement('div');
                    tagDiv.className = 'tag-card';
                    tagDiv.innerHTML = `
                        <div class="tag-header">
                            <div class="tag-logo">JOZU AUTO PART</div>
                            <div class="tag-title">PRODUCTION TAG</div>
                        </div>
                        <div class="tag-body">
                            <table>
                                <tr>
                                    <th>Part No.</th>
                                    <td>${partNo}</td>
                                </tr>
                                <tr>
                                    <th>Part Name</th>
                                    <td>${partName}</td>
                                </tr>
                                <tr>
                                    <th>Quantity</th>
                                    <td><strong>${qty}</strong> Pcs</td>
                                </tr>
                                <tr>
                                    <th>Lot No.</th>
                                    <td>${lotNo}</td>
                                </tr>
                            </table>
                        </div>
                        <div class="tag-footer">
                            <svg class="barcode" data-barcode="${lotNo}-${currentTagCount+1}"></svg>
                        </div>
                    `;
                    pageDiv.appendChild(tagDiv);
                    currentTagCount++;
                }
                container.appendChild(pageDiv);
            }

            // เรนเดอร์บาร์โค้ดทั้งหมด
            document.querySelectorAll('.barcode').forEach((el) => {
                JsBarcode(el, el.getAttribute('data-barcode'), {
                    format: "CODE128",
                    width: 1.2,
                    height: 35,
                    displayValue: true,
                    fontSize: 10
                });
            });
        });
    </script>
</body>
</html>
