    <style>
        @page {
            size: A4 landscape;
            margin: 0;
        }
        body {
            font-family: 'Tahoma', 'Arial', sans-serif;
            background: #eee;
            margin: 0;
            padding: 5px;
        }
        .no-print-bar {
            background: #333;
            color: #fff;
            padding: 8px 15px;
            margin-bottom: 10px;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .page {
            width: 297mm;
            height: 210mm;
            padding: 5mm 6mm;
            margin: 0 auto 5mm auto;
            background: white;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            box-sizing: border-box;
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            grid-template-rows: repeat(3, 1fr);
            gap: 3mm 4mm;
            page-break-after: always;
            page-break-inside: avoid;
        }
        @media print {
            body { background: none; padding: 0; }
            .no-print-bar { display: none !important; }
            .page { box-shadow: none; margin: 0; width: 297mm; height: 210mm; }
        }

        .tag-card {
            border: 1.5px solid #000;
            box-sizing: border-box;
            padding: 2px;
            background: #fff;
            font-size: 16px;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .tag-table {
            width: 100%;
            border-collapse: collapse;
            table-layout: fixed;
            height: 100%;
        }

        .tag-table td {
            border: 1px solid #000;
            padding: 2px 4px;
            vertical-align: middle;
            word-wrap: break-word;
        }

        .fw-bold { font-weight: bold; }
        .text-center { text-align: center; }

        .part-no-text {
            font-size: 20px;
            font-weight: 900;
            letter-spacing: 0.5px;
            padding: 2px 4px;
        }

        .qty-text {
            font-size: 20px;
            font-weight: bold;
        }

        .code-text {
            font-size: 20px;
            font-weight: bold;
        }

        .logo-stem {
            font-size: 15px;
            font-style: italic;
            font-weight: 900;
            padding-left: 2px;
        }

        .barcode-container {
            text-align: center;
        }

        .barcode-container svg {
            width: 100%;
            height: 20px;
        }
    </style>
</head>

            const master = Masterparts[foundKey] || {};

            return {
                partNo: pNo,
                partName: params.get('partName') || master.partName || 'BRACKET, RADIO TUNER MOUNTING, NO.2',
                qty: master.qty || 50,
                totalOrder: parseInt(params.get('qty')) || parseInt(params.get('totalOrder')) || 6300,
                lotNo: params.get('lotNo') || '1037601',
                code: params.get('code') || master.code || 'JA318'
            };
        }

  function generateTags() {
            const data = getUrlParams();
            const stdPack = data.qty;
            const totalOrder = data.totalOrder;
            const totalTags = Math.ceil(totalOrder / stdPack);

            const container = document.getElementById('printContainer');
            document.getElementById('tagSummary').innerText = `Part No: ${data.partNo} | Qty/Tag: ${stdPack} | Total Order: ${totalOrder.toLocaleString()} | Total Tags: ${totalTags} ใบ`;

            container.innerHTML = '';
            let currentContainer = null;

            // กำหนดชื่อไฟล์รูปภาพโลโก้ของแต่ละลูกค้า (สามารถเปลี่ยน Path ให้ตรงกับที่เก็บไฟล์จริงในเครื่องหรือ GitHub ของคุณได้)
            const logoImages = {
                "STEM": "stem-logo.png.jpg",   
                "FTS": "fts-logo.png.jpg",     
                "TMC": "tmc-logo.png.jpg",     
                "MSFT": "msft-logo.png.jpg",
                "TH": "Jozu.png",
                "TSM": "Jozu.png",
            };

            for (let i = 1; i <= totalTags; i++) {
                if ((i - 1) % 6 === 0) {
                    currentContainer = document.createElement('div');
                    currentContainer.className = 'page';
                    container.appendChild(currentContainer);
                }

                const currentQty = (i === totalTags && totalOrder % stdPack !== 0) ? (totalOrder % stdPack) : stdPack;

              // เช็ค Code เพื่อเลือกกลุ่มลูกค้าให้แม่นยำขึ้น
    let tagCode = data.code ? String(data.code).trim().toUpperCase() : "STEM";
    let companyName = "STEM"; 

    if (tagCode.includes("TH") || tagCode.startsWith("TH")) {
        companyName = "TH"; // 👈 บังคับให้งานกลุ่ม TH มาลงที่นี่เพื่อดึง "Jozu.png"
    } else if (tagCode.includes("FTS") || tagCode.startsWith("F")) {
        companyName = "FTS";
    } else if (tagCode.includes("TMC") || tagCode.startsWith("T")) {
        companyName = "TMC";
    } else if (tagCode.includes("MSFT") || tagCode.startsWith("M")) {
        companyName = "MSFT";
    } else {
        companyName = "STEM";
    }

    // ดึงไฟล์รูปตามชื่อบริษัท (ถ้าเป็น TH จะวิ่งไปหยิบ Jozu.png ตามที่ตั้งค่าไว้ใน logoImages)
    let logoSrc = logoImages[companyName] || "Jozu.png";

                const tagCard = document.createElement('div');
                tagCard.className = 'tag-card';
                tagCard.innerHTML = `
                    <table class="tag-table">
                        <tr>
                            <td style="width: 22%; font-size: 14px; height: 20px;">Part No.</td>
                            <td colspan="3" class="part-no-text">${data.partNo}</td>
                        </tr>
                        <tr>
                            <td style="font-size: 14px; height: 18px;">Part Name</td>
                            <td colspan="3" style="font-size: 14px;">${data.partName}</td>
                        </tr>
                        <tr>
                            <td style="font-size: 14px; height: 20px;">Q'ty</td>
                            <td class="qty-text" style="width: 30%;">${currentQty} <span style="font-size: 12px; font-weight: normal;">Pcs.</span></td>
                            <td style="width: 20%; font-size: 11px;">Stamp Mark</td>
                            <td style="width: 28%;"></td>
                        </tr>
                        <tr>
                            <td style="font-size: 10px; height: 18px;">Production Data/Lot No.:</td>
                            <td class="fw-bold" style="font-size: 12px;">${data.lotNo}</td>
                            <td style="font-size: 11px;">STAM Code</td>
                            <td class="code-text text-center">${data.code}</td>
                        </tr>

                        <!-- แถวที่ 1: หัวข้อวันที่ -->
                        <tr>
                            <td style="font-size: 14px; height: 16px;">Production Date</td>
                            <td style="font-size: 14px;">Supplier Check</td>
                            <td style="font-size: 14px;">Delivery Date</td>
                            <td class="fw-bold text-center" style="font-size: 10px;">STAM QC Receiving</td>
                        </tr>

                        <!-- แถวที่ 2: ช่องว่างสำหรับปั๊มตรา -->
                        <tr style="height: 34px;">
                            <td></td>
                            <td></td>
                            <td></td>
                            <td></td>
                        </tr>

                        <!-- แถวที่ 3: แถว Time / by. -->
                        <tr>
                            <td style="font-size: 9px; height: 16px;">Time</td>
                            <td style="font-size: 9px;">Time</td>
                            <td style="font-size: 9px;">Time</td>
                            <td style="font-size: 9px;">by.</td>
                        </tr>

                        <!-- แถวที่ 4: โซนบาร์โค้ด พร้อมแสดงรูปภาพโลโก้ -->
                        <tr style="height: 26px;">
                            <td class="logo-stem" style="text-align: center; vertical-align: middle; padding: 0;">
                                <img src="${logoSrc}" alt="${companyName}" style="max-height: 22px; max-width: 55px; object-fit: contain; display: block; margin: 0 auto;">
                            </td>
                            <td colspan="3" class="barcode-container">
                                <svg id="barcode_${i}"></svg>
                            </td>
                        </tr>
                    </table>
                `;

                currentContainer.appendChild(tagCard);

                setTimeout(((index, partNoVal) => {
                    return () => {
                        const svgElement = document.getElementById(`barcode_${index}`);
                        if (svgElement) {
                            JsBarcode(svgElement, partNoVal, {
                                format: "CODE128",
                                height: 20,
                                width: 1.3,
                                displayValue: false,
                                margin: 0
                            });
                        }
                    };
                })(i, data.partNo), 50);
            }
        }

        window.onload = generateTags;
    </script>
</body>
