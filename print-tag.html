<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>Print STEM Tags (6 Tags / A4 Landscape)</title>
    <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>
    <style>
        @page {
            size: A4 landscape;
            margin: 0;
        }
        body {
            font-family: 'Tahoma', sans-serif;
            background: #eee;
            margin: 0;
            padding: 10px;
        }
        .page {
            width: 297mm;
            height: 210mm;
            padding: 6mm 8mm;
            margin: 0 auto;
            background: white;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            box-sizing: border-box;
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            grid-template-rows: repeat(3, 1fr);
            gap: 4mm;
            page-break-after: always;
            page-break-inside: avoid;
        }
        @media print {
            body { 
                background: none; 
                padding: 0; 
                margin: 0;
            }
            .page { 
                box-shadow: none; 
                margin: 0; 
                width: 297mm;
                height: 210mm;
                page-break-after: always;
                page-break-inside: avoid;
            }
            .no-print { display: none; }
        }
        .tag-card {
            border: 2px solid #000;
            padding: 6px 8px;
            box-sizing: border-box;
            font-size: 10px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            background: #fff;
            height: 100%;
        }
        table.tag-table {
            width: 100%;
            border-collapse: collapse;
            border: 1px solid #000;
            table-layout: fixed;
        }
        table.tag-table th, table.tag-table td {
            border: 1px solid #000;
            padding: 4px 6px;
            vertical-align: middle;
            overflow: hidden;
        }
        .label-title { font-weight: bold; }
        .text-center { text-align: center; }
        .fw-bold { font-weight: bold; }
        
        /* ขยายขนาดตัวหนังสือและทำให้ตัวหนาเฉพาะ Part No. Value */
        .part-no-value {
            font-size: 22px !important;
            font-weight: bold;
        }

        .footer-section {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 4px;
        }
        .logo-box {
            font-weight: bold;
            font-style: italic;
            font-size: 14px;
            color: #003366;
            font-family: 'Arial Black', sans-serif;
        }
        .barcode-box {
            text-align: center;
            flex-grow: 1;
            margin-left: 15px;
            margin-right: 15px;
        }
        .barcode-box svg {
            max-height: 32px;
            width: 100%;
        }
    </style>
</head>
