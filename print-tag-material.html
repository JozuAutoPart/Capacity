<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>พิมพ์ Tag วัสดุ (Material Tag)</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { 
            background: #555; 
            font-family: 'Sarabun', sans-serif; 
            margin: 0;
            padding: 0;
        }
        .page {
            width: 100mm;
            height: 50mm;
            padding: 4mm;
            margin: 10mm auto;
            background: white;
            box-shadow: 0 0 10px rgba(0,0,0,0.5);
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .tag-header { 
            font-weight: bold; 
            border-bottom: 2px solid #000; 
            padding-bottom: 2px; 
            margin-bottom: 3px; 
            font-size: 13px;
        }
        .tag-body {
            font-size: 12px;
            line-height: 1.3;
        }
        .tag-footer {
            font-size: 10px;
            border-top: 1px solid #ccc;
            padding-top: 2px;
        }
        @media print {
            body { background: none; }
            .page { 
                width: 100mm; 
                height: 50mm; 
                margin: 0; 
                box-shadow: none; 
                page-break-after: always;
            }
            .no-print { display: none; }
        }
    </style>
</head>
<body>

    <div class="container text-center my-3 no-print">
        <button onclick="window.print()" class="btn btn-primary fw-bold px-4">🖨️ พิมพ์ Tag ขนาด 100x50 มม.</button>
    </div>

    <div id="tagContainer">
        <!-- Tag จะถูกสร้างอัตโนมัติที่นี่ -->
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const partNo = urlParams.get('partNo') || '-';
        const icNo = urlParams.get('icNo') || '-';
        const qty = urlParams.get('qty') || '0';
        const typeSize = urlParams.get('type') || '-';
        const unit = urlParams.get('unit') || 'Sheet';

        // สร้างวันที่ปัจจุบันในรูปแบบ DD/MM/YYYY (หรือจะปรับเปลี่ยนตามต้องการ)
        const now = new Date();
        const currentDate = String(now.getDate()).padStart(2, '0') + '/' + 
                            String(now.getMonth() + 1).padStart(2, '0') + '/' + 
                            (now.getFullYear() + 543); // ปี พ.ศ.

        const container = document.getElementById('tagContainer');
        
        let html = `
            <div class="page">
                <div>
                    <div class="tag-header d-flex justify-content-between">
                        <span>MATERIAL TAG</span>
                        <span>RECEIVE</span>
                    </div>
                    <div class="tag-body">
                        <div><strong>Date:</strong> <span class="fw-bold">${currentDate}</span></div>
                        <div><strong>Part No:</strong> <span class="text-info">${partNo}</span></div>
                        <div><strong>IC No:</strong> <span class="text-dark fw-bold">${icNo}</span></div>
                        <div><strong>Type / Size:</strong> ${typeSize}</div>
                        <div><strong>Qty:</strong> <span class="text-danger fw-bold">${Number(qty).toLocaleString()} ${unit}</span></div>
                    </div>
                </div>
                <div class="tag-footer text-center text-muted">
                    Jozu Auto Part Co., Ltd. - Material Control
                </div>
            </div>
        `;
        container.innerHTML = html;
    </script>
</body>
</html>
