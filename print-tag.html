<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>Print STEM Tags (6 Tags / A4 Landscape)</title>
    <!-- โหลดไลบรารี JsBarcode สำหรับสร้างบาร์โค้ดอัตโนมัติ -->
    <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>
    <style>
        @page {
            size: A4 landscape;
            margin: 8mm;
        }
        body {
            font-family: 'Tahoma', sans-serif;
            background: #eee;
            margin: 0;
            padding: 20px;
        }
        .page {
            width: 297mm;
            min-height: 210mm;
            padding: 8mm;
            margin: 0 auto 20px auto;
            background: white;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            box-sizing: border-box;
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            grid-template-rows: repeat(3, 1fr);
            gap: 6mm;
        }
        @media print {
            body { background: none; padding: 0; }
            .page { box-shadow: none; margin: 0; page-break-after: always; }
            .no-print { display: none; }
        }
        .tag-card {
            border: 2px solid #000;
            padding: 5px;
            box-sizing: border-box;
            font-size: 10px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            background: #fff;
            height: 60mm;
        }
        table.tag-table {
            width: 100%;
            border-collapse: collapse;
            border: 1px solid #000;
        }
        table.tag-table th, table.tag-table td {
            border: 1px solid #000;
            padding: 2px 4px;
            vertical-align: middle;
        }
        .label-title { font-weight: bold; }
        .text-center { text-align: center; }
        .fw-bold { font-weight: bold; }
        .footer-section {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 2px;
        }
        .logo-box {
            font-weight: bold;
            font-style: italic;
            font-size: 14px;
            color: #003366;
            font-family: 'Arial Black', sans-serif;
        }
        .barcode-box {
            text-align: center;
            flex-grow: 1;
            margin-left: 10px;
            margin-right: 10px;
        }
        .barcode-box svg {
            max-height: 35px;
            width: 100%;
        }
    </style>
</head>
<body>

    <div class="no-print" style="text-align: center; margin-bottom: 20px;">
        <button onclick="window.print()" style="padding: 10px 20px; font-size: 16px; background: #28a745; color: white; border: none; cursor: pointer; border-radius: 5px;">
            🖨️ พิมพ์ใบ Tag ทั้งหมด (แนวนอน)
        </button>
        <span id="tagInfoSummary" style="margin-left: 15px; font-weight: bold; color: #333;">กำลังโหลดข้อมูลจาก Google Sheets...</span>
    </div>

    <div id="tagContainer"></div>

    <script>
        // กำหนด URL ของ Apps Script Web App ของพี่มิวตรงนี้ (อันเดียวกับที่ใช้ในหน้า Index หลัก)
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxLVXRo080-Ov6x_qexlga5-H_35aod-6N0ZGQhg1q2cQMnb8ZZikP0MQS3iKE_zRoFCw/exec"; 

        async function initTagPage() {
            const urlParams = new URLSearchParams(window.location.search);
            const paramPartNo = urlParams.get('partNo') || '61761-KK040';
            const paramLotNo = urlParams.get('lotNo') || '124';
            const paramQty = Number(urlParams.get('qty')) || 667;

            let masterPartName = "STEERING ASSY";
            let masterStemCode = "-";
            let masterPcsPerTag = 100;

            try {
                // 1. ลองดึงจาก localStorage ก่อน (เผื่อมีอยู่แล้ว)
                let masterList = JSON.parse(localStorage.getItem('masterParts') || '[]');

                // 2. ถ้าใน localStorage ไม่มี ให้ดึงตรงจาก Google Sheets (Apps Script) ทันที
                if (masterList.length === 0 && SCRIPT_URL !== "ใส่_URL_Google_Apps_Script_ของพี่มิวตรงนี้") {
                    const response = await fetch(`${SCRIPT_URL}?action=getMasterParts`);
                    const result = await response.json();
                    if (result && result.data) {
                        masterList = result.data;
                        localStorage.setItem('masterParts', JSON.stringify(masterList));
                    }
                }

                // ค้นหา Part No. ตรงกับ คอลัมน์ B (Index 1)
                const found = masterList.find(m => {
                    if (!m) return false;
                    if (Array.isArray(m)) {
                        return String(m[1]).trim() === String(paramPartNo).trim();
                    } else {
                        let pNo = m["partNo"] || m["Part No."] || "";
                        return String(pNo).trim() === String(paramPartNo).trim();
                    }
                });

                if (found) {
                    if (Array.isArray(found)) {
                        // คอลัมน์ H = Index 7 (Part Name), คอลัมน์ I = Index 8 (STEM Code)
                        if (found[7]) masterPartName = found[7];
                        if (found[8]) masterStemCode = found[8];
                    } else {
                        masterPartName = found["Part Name"] || found["partName"] || masterPartName;
                        masterStemCode = found["STEM Code"] || found["stemCode"] || masterStemCode;
                    }
                }
            } catch (e) {
                console.error("Error fetching master data:", e);
            }

            // สั่งสร้าง Tag แสดงผล
            generateTagsUI({
                partNo: paramPartNo,
                lotNo: paramLotNo,
                totalQty: paramQty,
                pcsPerTag: masterPcsPerTag,
                partName: masterPartName,
                stemCode: masterStemCode
            });
        }

        function generateTagsUI(printData) {
            const container = document.getElementById('tagContainer');
            container.innerHTML = '';

            const totalTags = Math.ceil(printData.totalQty / printData.pcsPerTag);
            
            document.getElementById('tagInfoSummary'].innerText = `Part No: ${printData.partNo} | Lot: ${printData.lotNo} | ยอดรวม: ${printData.totalQty.toLocaleString()} Pcs (${totalTags} ใบ)`;

            let allTagsHTML = '';
            let currentA4PageHTML = '';

            for (let i = 1; i <= totalTags; i++) {
                let currentQty = printData.pcsPerTag;
                if (i === totalTags) {
                    let remainder = printData.totalQty % printData.pcsPerTag;
                    if (remainder > 0) currentQty = remainder;
                }

                const tagHTML = `
                    <div class="tag-card">
                        <table class="tag-table">
                            <tr>
                                <td class="label-title" style="width: 18%;">Part No.</td>
                                <td colspan="3" class="fw-bold" style="font-size: 12px; width: 82%;">${printData.partNo}</td>
                            </tr>
                            <tr>
                                <td class="label-title">Part Name</td>
                                <td colspan="3">${printData.partName}</td>
                            </tr>
                            <tr>
                                <td class="label-title">Q'ty</td>
                                <td style="width: 40%;"><span class="fw-bold" style="font-size: 13px;">${currentQty}</span> Pcs.</td>
                                <td class="label-title text-center" style="width: 18%;">Stamp Mark</td>
                                <td style="width: 24%;"></td>
                            </tr>
                            <tr>
                                <td class="label-title" style="font-size: 9px;">Production Data / Lot No.:</td>
                                <td>${printData.lotNo}</td>
                                <td class="label-title text-center">STEM Code</td>
                                <td>${printData.stemCode}</td>
                            </tr>
                            <tr>
                                <td class="text-center fw-bold" style="font-size: 8.5px;">Production Date</td>
                                <td class="text-center fw-bold" style="font-size: 8.5px;">Supplier Check</td>
                                <td class="text-center fw-bold" style="font-size: 8.5px;">Delivery Date</td>
                                <td class="text-center fw-bold" style="font-size: 8.5px;">STEM QC Receiving</td>
                            </tr>
                            <tr>
                                <td style="height: 10mm;"></td>
                                <td></td>
                                <td></td>
                                <td></td>
                            </tr>
                            <tr>
                                <td class="text-center" style="font-size: 8.5px;">Time</td>
                                <td class="text-center" style="font-size: 8.5px;">Time</td>
                                <td class="text-center" style="font-size: 8.5px;">Time</td>
                                <td class="text-center" style="font-size: 8.5px;">by.</td>
                            </tr>
                        </table>
                        <div class="footer-section">
                            <div class="logo-box">STEM</div>
                            <div class="barcode-box">
                                <svg class="barcode" data-barcode="${printData.partNo}"></svg>
                            </div>
                            <div style="font-size: 8px; text-align: right;"></div>
                        </div>
                    </div>
                `;

                currentA4PageHTML += tagHTML;

                if (i % 6 === 0 || i === totalTags) {
                    allTagsHTML += `<div class="page">${currentA4PageHTML}</div>`;
                    currentA4PageHTML = ''; 
                }
            }

            container.innerHTML = allTagsHTML;

            document.querySelectorAll('.barcode').forEach(svg => {
                JsBarcode(svg, svg.getAttribute('data-barcode'), {
                    format: "CODE128",
                    displayValue: false,
                    width: 1.8,
                    height: 28,
                    margin: 1
                });
            });
        }

        window.onload = initTagPage;
    </script>
</body>
</html>
