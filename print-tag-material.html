<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>พิมพ์ Tag วัสดุ</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        /* สั่งซ่อน Header / Footer อัตโนมัติเมื่อสั่งพิมพ์ */
        @page {
            size: 100mm 50mm;
            margin: 0;
        }
        body {
            background-color: #555;
            font-family: 'Sarabun', sans-serif;
            margin: 0;
            padding: 0;
        }
        .tag-container {
            width: 100mm;
            height: 50mm;
            background: #fff;
            margin: 20px auto;
            padding: 4mm 6mm;
            box-shadow: 0 0 10px rgba(0,0,0,0.3);
            position: relative;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .tag-header {
            border-bottom: 2px solid #000;
            padding-bottom: 2px;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 14pt;
            color: #000;
        }
        .tag-body {
            font-size: 11pt;
            line-height: 1.3;
            color: #000;
        }
        .tag-body div {
            margin-bottom: 2px;
        }
        .tag-footer {
            border-top: 1px solid #000;
            padding-top: 2px;
            text-align: center;
            font-size: 8pt;
            color: #000;
        }
        .text-black-custom {
            color: #000 !important;
        }
        @media print {
            body {
                background: none;
            }
            .no-print {
                display: none;
            }
            .tag-container {
                margin: 0;
                box-shadow: none;
                width: 100mm;
                height: 50mm;
                page-break-after: always;
            }
        }
    </style>
</head>
<body>

    <div class="text-center no-print my-3">
        <button class="btn btn-primary fw-bold px-4" onclick="window.print()">
            <i class="fas fa-print me-2"></i> พิมพ์ Tag ขนาด 100x50 มม.
        </button>
    </div>

    <div class="tag-container">
        <div class="tag-header">
            <span>MATERIAL TAG</span>
            <span id="tagReceiveType">RECEIVE</span>
        </div>
        <div class="tag-body">
            <div><strong>Date:</strong> <span id="lblDate" class="text-black-custom"></span></div>
            <div><strong>Part No:</strong> <span id="lblPartNo" class="text-black-custom"></span></div>
            <div><strong>IC No:</strong> <span id="lblIcNo" class="text-black-custom"></span></div>
            <div><strong>Type / Size:</strong> <span id="lblType" class="text-black-custom"></span></div>
            <div><strong>Qty:</strong> <span id="lblQty" class="text-black-custom fw-bold"></span></div>
        </div>
        <div class="tag-footer">
            Jozu Auto Part Co., Ltd. - Material Control
        </div>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        
        const rawDate = params.get('date') || '';
        let formattedDate = rawDate;
        if (rawDate) {
            let parts = rawDate.split('-');
            if (parts.length === 3) {
                formattedDate = `${parts[2]}/${parts[1]}/${parts[0]}`;
            }
        } else {
            let now = new Date();
            let dd = String(now.getDate()).padStart(2, '0');
            let mm = String(now.getMonth() + 1).padStart(2, '0');
            let yyyy = now.getFullYear();
            formattedDate = `${dd}/${mm}/${yyyy}`;
        }

        const partNo = params.get('partNo') || '-';
        const icNo = params.get('icNo') || '-';
        const qty = params.get('qty') || '0';
        const type = params.get('type') || '-';
        const unit = params.get('unit') || 'Sheet';

        document.getElementById('lblDate').innerText = formattedDate;
        document.getElementById('lblPartNo').innerText = partNo;
        document.getElementById('lblIcNo').innerText = icNo;
        document.getElementById('lblType').innerText = type;
        document.getElementById('lblQty').innerText = `${Number(qty).toLocaleString()} ${unit}`;
    </script>
</body>
</html>
