<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>Print STEM Tags (6 Tags / A4 Landscape)</title>
    <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>
    <style>
        @page {
            size: A4 landscape;
            margin: 8mm;
        }
        body {
            font-family: 'Tahoma', sans-serif;
            background: #eee;
            margin: 0;
            padding: 20px;
        }
        .page {
            width: 297mm;
            min-height: 210mm;
            padding: 8mm;
            margin: 0 auto 20px auto;
            background: white;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            box-sizing: border-box;
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            grid-template-rows: repeat(3, 1fr);
            gap: 6mm;
        }
        @media print {
            body { background: none; padding: 0; }
            .page { box-shadow: none; margin: 0; page-break-after: always; }
            .no-print { display: none; }
        }
        .tag-card {
            border: 2px solid #000;
            padding: 5px;
            box-sizing: border-box;
            font-size: 10px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            background: #fff;
            height: 60mm;
        }
        table.tag-table {
            width: 100%;
            border-collapse: collapse;
            border: 1px solid #000;
        }
        table.tag-table th, table.tag-table td {
            border: 1px solid #000;
            padding: 2px 4px;
            vertical-align: middle;
        }
        .label-title { font-weight: bold; }
        .text-center { text-align: center; }
        .fw-bold { font-weight: bold; }
        .footer-section {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 2px;
        }
        .logo-box {
            font-weight: bold;
            font-style: italic;
            font-size: 14px;
            color: #003366;
            font-family: 'Arial Black', sans-serif;
        }
        .barcode-box {
            text-align: center;
            flex-grow: 1;
            margin-left: 10px;
            margin-right: 10px;
        }
        .barcode-box svg {
            max-height: 35px;
            width: 100%;
        }
    </style>
</head>
<body>

    <div class="no-print" style="text-align: center; margin-bottom: 20px;">
        <button onclick="window.print()" style="padding: 10px 20px; font-size: 16px; background: #28a745; color: white; border: none; cursor: pointer; border-radius: 5px;">
            🖨️ พิมพ์ใบ Tag ทั้งหมด (แนวนอน)
        </button>
        <span id="tagInfoSummary" style="margin-left: 15px; font-weight: bold; color: #333;"></span>
    </div>

    <div id="tagContainer"></div>

    <script>
        // ฐานข้อมูลจับคู่ PartNo กับ PartName และ STEM Code (พี่มิวสามารถเพิ่มรายการอื่นๆ เข้ามาตรงนี้ได้เรื่อยๆ ครับ)
        const partDatabase = {
            "53219-0D020": { name: "SUPPORT,RADIATOR,LWR,RR", stem: "JA114" },
            "55330-0D480-10": { name: "REINFORCEMENT ASSY INSTRUMENT PA", stem: "JA118" },
            "55330-0D490-10": { name: "REINFORCEMENT ASSY INSTRUMENT PA", stem: "JA119" },
            "61761-KK040": { name: "REINFROCE,SEAT BELT ANCHOR,NO.1 U", stem: "JA183" },
            "61762-KK050": { name: "REINFROCE,SELT ANCHOR,NO.1 UPR LH", stem: "JA184" },
            "55428-0D010": { name: "BRACKET,AIR BAG PASSENGER MT,NO.2", stem: "JA197" },
            "55428-0D020": { name: "BRACKET,AIR BAG PASSENGER MT,NO.2", stem: "JA199" },
            "55309-06190": { name: "RETAINER SUB ASSY LUG DOOR LOCK", stem: "JA217" },
            "57248-0D010": { name: "BRK,T FLEXIBLE HOSE NO.1 OR", stem: "JA112" },
            "57249-0D040": { name: "BRK,T FLEXIBLE HOSE NO.1 OL", stem: "JA113" },
            "67323-0D090": { name: "EXTENSION,FR DOOR BEAM RR RH", stem: "JA121" },
            "67324-0D080": { name: "EXTENSION,FR DOOR BEAM RR LH", stem: "JA122" },
            "62590-47A50": { name: "RIF-RAD CORE LWR", stem: "JA160" },
            "62590-47A5A": { name: "RIF-RAD CORE LWR", stem: "JA161" },
            "76294-47A0A": { name: "BULKHEAD ASSY-FR PLR LWR RH", stem: "JA168" },
            "76295-47A0A": { name: "BULKHEAD ASSY-FR PLR LWR LH", stem: "JA167" },
            "76344-47GLA": { name: "ANCH ASSY-SEAT BELT", stem: "JA168" },
            "55328-KK030": { name: "STAY INSTRUMENT PANEL NO.3", stem: "JA176" },
            "55328-KK040": { name: "STAY INSTRUMENT PANEL NO.3", stem: "JA177" },
            "55329-KK030": { name: "STAY INSTRUMENT PANEL NO.4", stem: "JA178" },
            "55329-KK040": { name: "STAY INSTRUMENT PANEL NO.4", stem: "JA179" },
            "58221-KK010": { name: "REINFORCEMENT,FLOOR PANEL,FR RH", stem: "JA186" },
            "58221-KK020": { name: "REINFORCEMENT,FLOOR PANEL,FR LH", stem: "JA187" },
            "58222-KK010": { name: "REINFORCEMENT,FLOOR PANEL,FR RH", stem: "JA192" }
        };

        function initTagPage() {
            const urlParams = new URLSearchParams(window.location.search);
            const partNo = (urlParams.get('partNo') || '').trim();
            const lotNo = urlParams.get('lotNo') || '-';
            const totalQty = Number(urlParams.get('qty')) || 0;
            const pcsPerTag = Number(urlParams.get('pcsPerTag')) || 50;

            // ดึงชื่อและ STEM Code จากฐานข้อมูลในโค้ดอัตโนมัติ
            let partName = '-';
            let stemCode = '-';

            if (partDatabase[partNo]) {
                partName = partDatabase[partNo].name;
                stemCode = partDatabase[partNo].stem;
            } else {
                // เผื่อกรณีมีส่งพารามิเตอร์มาตรงๆ
                partName = urlParams.get('partName') || '-';
                stemCode = urlParams.get('stemCode') || '-';
            }

            generateTagsUI({
                partNo: partNo || '-',
                lotNo: lotNo,
                totalQty: totalQty,
                pcsPerTag: pcsPerTag,
                partName: partName,
                stemCode: stemCode
            });
        }

        function generateTagsUI(printData) {
            const container = document.getElementById('tagContainer');
            container.innerHTML = '';

            const totalTags = Math.ceil(printData.totalQty / printData.pcsPerTag);
            
            document.getElementById('tagInfoSummary').innerText = `Part No: ${printData.partNo} | Part Name: ${printData.partName} | STEM: ${printData.stemCode} | ยอดรวม: ${printData.totalQty.toLocaleString()} Pcs (${totalTags} ใบ)`;

            let allTagsHTML = '';
            let currentA4PageHTML = '';

            for (let i = 1; i <= totalTags; i++) {
                let currentQty = printData.pcsPerTag;
                if (i === totalTags) {
                    let remainder = printData.totalQty % printData.pcsPerTag;
                    if (remainder > 0) currentQty = remainder;
                }

                const tagHTML = `
                    <div class="tag-card">
                        <table class="tag-table">
                            <tr>
                                <td class="label-title" style="width: 18%;">Part No.</td>
                                <td colspan="3" class="fw-bold" style="font-size: 12px; width: 82%;">${printData.partNo}</td>
                            </tr>
                            <tr>
                                <td class="label-title">Part Name</td>
                                <td colspan="3">${printData.partName}</td>
                            </tr>
                            <tr>
                                <td class="label-title">Q'ty</td>
                                <td style="width: 40%;"><span class="fw-bold" style="font-size: 13px;">${currentQty}</span> Pcs.</td>
                                <td class="label-title text-center" style="width: 18%;">Stamp Mark</td>
                                <td style="width: 24%;"></td>
                            </tr>
                            <tr>
                                <td class="label-title" style="font-size: 9px;">Production Data / Lot No.:</td>
                                <td style="width: 20%;">${printData.lotNo}</td>
                                <td class="label-title text-center" style="width: 18%;">STEM Code</td>
                                <td style="width: 24%;">${printData.stemCode}</td>
                            </tr>
                            <tr>
                                <td class="text-center fw-bold" style="font-size: 8.5px;">Production Date</td>
                                <td class="text-center fw-bold" style="font-size: 8.5px;">Supplier Check</td>
                                <td class="text-center fw-bold" style="font-size: 8.5px;">Delivery Date</td>
                                <td class="text-center fw-bold" style="font-size: 8.5px;">STEM QC Receiving</td>
                            </tr>
                            <tr>
                                <td style="height: 10mm;"></td>
                                <td></td>
                                <td></td>
                                <td></td>
                            </tr>
                            <tr>
                                <td class="text-center" style="font-size: 8.5px;">Time</td>
                                <td class="text-center" style="font-size: 8.5px;">Time</td>
                                <td class="text-center" style="font-size: 8.5px;">Time</td>
                                <td class="text-center" style="font-size: 8.5px;">by.</td>
                            </tr>
                        </table>
                        <div class="footer-section">
                            <div class="logo-box">STEM</div>
                            <div class="barcode-box">
                                <svg class="barcode" data-barcode="${printData.partNo}"></svg>
                            </div>
                            <div style="font-size: 8px; text-align: right;"></div>
                        </div>
                    </div>
                `;

                currentA4PageHTML += tagHTML;

                if (i % 6 === 0 || i === totalTags) {
                    allTagsHTML += `<div class="page">${currentA4PageHTML}</div>`;
                    currentA4PageHTML = ''; 
                }
            }

            container.innerHTML = allTagsHTML;

            document.querySelectorAll('.barcode').forEach(svg => {
                JsBarcode(svg, svg.getAttribute('data-barcode'), {
                    format: "CODE128",
                    displayValue: false,
                    width: 1.8,
                    height: 28,
                    margin: 1
                });
            });
        }

        window.onload = initTagPage;
    </script>
</body>
</html>
